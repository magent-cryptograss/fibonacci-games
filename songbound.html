<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>SONGBOUND</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #07060a; height: 100%; }
body { display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: monospace; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; border: 2px solid #221c30; box-shadow: 0 0 40px rgba(80,60,140,0.25); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="buffer" style="display:none"></canvas>
<script>
'use strict';

// ============================================================================
// SONGBOUND  -- working title, rename in TITLE below once the story exists.
// A 16-bit style RPG where music replaces magic.
// ============================================================================
const TITLE = 'SONGBOUND';
const SUBTITLE = 'a song against the quiet';

const W = 320, H = 240, SCALE = 3;
const canvas = document.getElementById('game');
canvas.width = W * SCALE; canvas.height = H * SCALE;
const dctx = canvas.getContext('2d');
dctx.imageSmoothingEnabled = false;
const buffer = document.getElementById('buffer');
buffer.width = W; buffer.height = H;
const ctx = buffer.getContext('2d');
ctx.imageSmoothingEnabled = false;

const TS = 16;

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function randInt(n) { return Math.floor(Math.random() * n); }
function pick(a) { return a[randInt(a.length)]; }
function chance(p) { return Math.random() < p; }
function lerp(a, b, t) { return a + (b - a) * t; }

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// ==================== BITMAP FONT (5x7, mixed case) ====================
const FONT = {
 'A':"0E11111F111111", 'B':"1E11111E11111E", 'C':"0E11101010110E", 'D':"1E11111111111E",
 'E':"1F10101E10101F", 'F':"1F10101E101010", 'G':"0E11101711110E", 'H':"1111111F111111",
 'I':"0E04040404040E", 'J':"0702020202120C", 'K':"11121418141211", 'L':"1010101010101F",
 'M':"111B1515111111", 'N':"11191513111111", 'O':"0E11111111110E", 'P':"1E11111E101010",
 'Q':"0E11111115120D", 'R':"1E11111E141211", 'S':"0F10100E01011E", 'T':"1F040404040404",
 'U':"1111111111110E", 'V':"11111111110A04", 'W':"11111115151B11", 'X':"11110A040A1111",
 'Y':"11110A04040404", 'Z':"1F01020408101F",
 'a':"00000E010F110F", 'b':"10101E1111111E", 'c':"00000E1010110E", 'd':"01010F1111110F",
 'e':"00000E111F100E", 'f':"0609081C080808", 'g':"00000F110F010E", 'h':"10101E11111111",
 'i':"04000C0404040E", 'j':"0200060202120C", 'k':"10101214181412", 'l':"0C04040404040E",
 'm':"00001A15151515", 'n':"00001E11111111", 'o':"00000E1111110E", 'p':"00001E111E1010",
 'q':"00000F110F0101", 'r':"00001619101010", 's':"00000F100E011E", 't':"08081C08080906",
 'u':"0000111111130D", 'v':"00001111110A04", 'w':"0000151515150A", 'x':"0000110A040A11",
 'y':"000011110F010E", 'z':"00001F0204081F",
 '0':"0E11131519110E", '1':"040C040404040E", '2':"0E11010608101F", '3':"1F01020601110E",
 '4':"02060A121F0202", '5':"1F101E0101110E", '6':"0608101E11110E", '7':"1F010204080808",
 '8':"0E11110E11110E", '9':"0E11110F01020C",
 ' ':"00000000000000", '.':"00000000000C0C", ',':"000000000C0C08", "'":"0C0C0800000000",
 '!':"04040404040004", '?':"0E110102040004", '-':"0000001F000000", ':':"000C0C000C0C00",
 '/':"01010204081010", '%':"191A0204080B13", '+':"0004041F040400", '*':"00150E1F0E1500",
 '(':"02040808080402", ')':"08040202020408", '<':"01020408040201", '>':"10080402040810",
 '"':"0A0A0000000000", '=':"00001F001F0000", '$':"040F140E051E04", ';':"000C0C000C0C08",
 '_':"0000000000001F", '#':"0A1F0A0A1F0A00", '&':"0C120C1A15120D", '@':"0E111715160E00"
};
const GLYPH_W = 6, GLYPH_H = 8;
const GLYPHS = {};
for (const ch in FONT) {
  const hx = FONT[ch], rows = [];
  for (let i = 0; i < 7; i++) rows.push(parseInt(hx.substr(i * 2, 2), 16));
  GLYPHS[ch] = rows;
}
function textWidth(s) { return String(s).length * GLYPH_W; }

// One glyph pass. Kept separate so outline/shadow passes are cheap to repeat.
function _glyphPass(str, x, y, color) {
  ctx.fillStyle = color;
  let cx = x;
  for (let i = 0; i < str.length; i++) {
    const g = GLYPHS[str[i]];
    if (g) {
      for (let r = 0; r < 7; r++) {
        const bits = g[r];
        if (!bits) continue;
        for (let b = 0; b < 5; b++) if (bits & (1 << (4 - b))) ctx.fillRect(cx + b, y + r, 1, 1);
      }
    }
    cx += GLYPH_W;
  }
}
// 16-bit text: a dark drop shadow under everything is most of the look.
function drawText(str, x, y, color, opts) {
  str = String(str); x = Math.round(x); y = Math.round(y);
  opts = opts || {};
  if (opts.outline) {
    const oc = opts.outline === true ? '#100c18' : opts.outline;
    _glyphPass(str, x - 1, y, oc); _glyphPass(str, x + 1, y, oc);
    _glyphPass(str, x, y - 1, oc); _glyphPass(str, x, y + 1, oc);
  }
  if (opts.shadow !== false) _glyphPass(str, x + 1, y + 1, opts.shadowColor || 'rgba(8,6,14,0.75)');
  _glyphPass(str, x, y, color || '#f4f0e8');
  return str.length * GLYPH_W;
}
function drawTextC(s, cx, y, color, opts) { return drawText(s, Math.round(cx - textWidth(s) / 2), y, color, opts); }
function drawTextR(s, rx, y, color, opts) { return drawText(s, Math.round(rx - textWidth(s)), y, color, opts); }

function wrap(str, pxw) {
  const maxc = Math.max(1, Math.floor(pxw / GLYPH_W));
  const out = [];
  for (const para of String(str).split('\n')) {
    const words = para.split(' ');
    let line = '';
    for (const w of words) {
      if (!line.length) line = w;
      else if ((line + ' ' + w).length <= maxc) line += ' ' + w;
      else { out.push(line); line = w; }
    }
    out.push(line);
  }
  return out;
}

// ==================== PIXEL PRIMITIVES ====================
function px(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }
function pcircle(g, cx, cy, r, c) {
  g.fillStyle = c;
  for (let dy = -r; dy <= r; dy++) {
    const dx = Math.floor(Math.sqrt(Math.max(0, r * r - dy * dy)));
    g.fillRect(Math.round(cx - dx), Math.round(cy + dy), dx * 2 + 1, 1);
  }
}
function pellipse(g, cx, cy, rx, ry, c) {
  g.fillStyle = c;
  for (let dy = -ry; dy <= ry; dy++) {
    const dx = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry))));
    g.fillRect(Math.round(cx - dx), Math.round(cy + dy), dx * 2 + 1, 1);
  }
}
function pring(g, cx, cy, r, c, thick) {
  thick = thick || 1;
  g.fillStyle = c;
  for (let dy = -r; dy <= r; dy++) {
    const o = Math.floor(Math.sqrt(Math.max(0, r * r - dy * dy)));
    const ir = r - thick;
    const i = Math.abs(dy) <= ir ? Math.floor(Math.sqrt(Math.max(0, ir * ir - dy * dy))) : -1;
    if (i < 0) g.fillRect(Math.round(cx - o), Math.round(cy + dy), o * 2 + 1, 1);
    else {
      g.fillRect(Math.round(cx - o), Math.round(cy + dy), o - i, 1);
      g.fillRect(Math.round(cx + i + 1), Math.round(cy + dy), o - i, 1);
    }
  }
}
function pline(g, x0, y0, x1, y1, c) {
  g.fillStyle = c;
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy;
  for (let i = 0; i < 600; i++) {
    g.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x0 += sx; }
    if (e2 < dx) { err += dx; y0 += sy; }
  }
}
// vertical gradient without canvas gradients, so it stays banded and pixelly
function vgrad(g, x, y, w, h, top, bot, steps) {
  steps = steps || h;
  const t = hexRGB(top), b = hexRGB(bot);
  const bandH = Math.max(1, Math.ceil(h / steps));
  for (let i = 0; i < steps; i++) {
    const f = steps === 1 ? 0 : i / (steps - 1);
    g.fillStyle = 'rgb(' + Math.round(lerp(t[0], b[0], f)) + ',' + Math.round(lerp(t[1], b[1], f)) + ',' + Math.round(lerp(t[2], b[2], f)) + ')';
    g.fillRect(x, y + i * bandH, w, bandH);
  }
}
function hexRGB(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
}
function shade(hex, amt) {
  const c = hexRGB(hex);
  return 'rgb(' + clamp(Math.round(c[0] + amt), 0, 255) + ',' + clamp(Math.round(c[1] + amt), 0, 255) + ',' + clamp(Math.round(c[2] + amt), 0, 255) + ')';
}

// ==================== UI ====================
// Translucent gradient window with a bevelled frame -- the SNES RPG look.
function drawWindow(x, y, w, h, opts) {
  opts = opts || {};
  const a = opts.alpha === undefined ? 0.88 : opts.alpha;
  ctx.globalAlpha = a;
  vgrad(ctx, x + 2, y + 2, w - 4, h - 4, opts.top || '#2a2050', opts.bot || '#140e2c', 10);
  ctx.globalAlpha = 1;
  // outer dark frame
  px(ctx, x + 1, y, w - 2, 1, '#0a0812'); px(ctx, x + 1, y + h - 1, w - 2, 1, '#0a0812');
  px(ctx, x, y + 1, 1, h - 2, '#0a0812'); px(ctx, x + w - 1, y + 1, 1, h - 2, '#0a0812');
  // bright bevel
  px(ctx, x + 2, y + 1, w - 4, 1, '#b8a8e0'); px(ctx, x + 1, y + 2, 1, h - 4, '#9888c8');
  px(ctx, x + 2, y + h - 2, w - 4, 1, '#4a3a70'); px(ctx, x + w - 2, y + 2, 1, h - 4, '#5a4a84');
  // inner hairline
  px(ctx, x + 3, y + 3, w - 6, 1, 'rgba(180,160,230,0.30)');
  px(ctx, x + 3, y + 3, 1, h - 6, 'rgba(180,160,230,0.20)');
}
function drawCursor(x, y, t) {
  const bob = Math.round(Math.sin(t / 150) * 1.5);
  const px0 = x + bob;
  for (let i = 0; i < 5; i++) px(ctx, px0 + i, y + i, 1, 9 - i * 2, '#2a1c08');
  for (let i = 0; i < 4; i++) px(ctx, px0 + i, y + 1 + i, 1, 7 - i * 2, '#ffd464');
  for (let i = 0; i < 2; i++) px(ctx, px0 + i, y + 2 + i, 1, 3 - i, '#fff0b0');
}
function drawBar(x, y, w, h, frac, c1, c2) {
  frac = clamp(frac, 0, 1);
  px(ctx, x - 1, y - 1, w + 2, h + 2, '#0a0812');
  px(ctx, x, y, w, h, '#241c3a');
  const fw = Math.round(w * frac);
  if (fw > 0) {
    vgrad(ctx, x, y, fw, h, c1 || '#70e890', c2 || '#1c8840', 3);
    px(ctx, x, y, fw, 1, shade(c1 || '#70e890', 40));
  }
}
function drawShadowEllipse(x, y, rx, ry) {
  ctx.globalAlpha = 0.3; pellipse(ctx, x, y, rx, ry, '#000000'); ctx.globalAlpha = 1;
}

// ==================== INPUT ====================
const keys = {}, pressedMap = {}, holdT = {};
const BLOCKED = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','KeyZ','KeyX','ShiftLeft','Tab','KeyQ','KeyE'];
addEventListener('keydown', e => {
  if (!keys[e.code]) pressedMap[e.code] = true;
  keys[e.code] = true;
  if (BLOCKED.indexOf(e.code) >= 0) e.preventDefault();
  audioUnlock();
  // queue, not a single slot: typing faster than one key per frame must not
  // silently drop characters out of the middle of a name
  if (e.key && e.key.length === 1) typedQueue.push(e.key);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const typedQueue = [];

const KEYMAP = {
  up: ['ArrowUp','KeyW'], down: ['ArrowDown','KeyS'],
  left: ['ArrowLeft','KeyA'], right: ['ArrowRight','KeyD'],
  ok: ['KeyZ','Enter','Space'], back: ['KeyX','Escape','Backspace'],
  menu: ['KeyC','ShiftLeft'], lb: ['KeyQ'], rb: ['KeyE']
};
function held(a) { for (const c of KEYMAP[a]) if (keys[c]) return true; return false; }
function pressed(a) { for (const c of KEYMAP[a]) if (pressedMap[c]) { pressedMap[c] = false; return true; } return false; }
function repeated(a, dt) {
  if (pressed(a)) { holdT[a] = 0; return true; }
  if (held(a)) {
    holdT[a] = (holdT[a] || 0) + dt;
    if (holdT[a] > 280) { holdT[a] -= 110; return true; }
  } else holdT[a] = 0;
  return false;
}
function clearPressed() { for (const k in pressedMap) pressedMap[k] = false; }

// ==================== AUDIO ====================
let actx = null, masterGain = null, musicGain = null, sfxGain = null, revSend = null;
function makeReverb() {
  // A short generated impulse: gives everything a little room, which is most of
  // the difference between "chiptune" and "16-bit sample" to the ear.
  const len = Math.floor(actx.sampleRate * 1.5);
  const buf = actx.createBuffer(2, len, actx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) {
      const decay = Math.pow(1 - i / len, 2.6);
      d[i] = (Math.random() * 2 - 1) * decay * 0.5;
    }
  }
  const conv = actx.createConvolver(); conv.buffer = buf;
  return conv;
}
function audioUnlock() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = actx.createGain(); masterGain.gain.value = 0.55; masterGain.connect(actx.destination);
      const conv = makeReverb();
      const wet = actx.createGain(); wet.gain.value = 0.30;
      conv.connect(wet); wet.connect(masterGain);
      revSend = conv;
      musicGain = actx.createGain(); musicGain.gain.value = 0.5; musicGain.connect(masterGain);
      sfxGain = actx.createGain(); sfxGain.gain.value = 0.85; sfxGain.connect(masterGain);
      const mrev = actx.createGain(); mrev.gain.value = 0.5; musicGain.connect(mrev); mrev.connect(conv);
      const srev = actx.createGain(); srev.gain.value = 0.28; sfxGain.connect(srev); srev.connect(conv);
    } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}

const NOTE_BASE = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
const freqCache = {};
function freqOf(n) {
  if (freqCache[n] !== undefined) return freqCache[n];
  const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
  let f = 0;
  if (m) {
    let s = NOTE_BASE[m[1]];
    if (m[2] === '#') s++; else if (m[2] === 'b') s--;
    f = 440 * Math.pow(2, (((parseInt(m[3], 10) + 1) * 12 + s) - 69) / 12);
  }
  freqCache[n] = f; return f;
}
let noiseBuf = null;
function getNoise() {
  if (!noiseBuf && actx) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}

// ---- instrument voices ----
// Each instrument in the game has a matching synth voice, so choosing a banjo
// at character creation actually changes what your songs sound like.
const VOICES = {
  // plucked string: two detuned saws through a fast-closing lowpass
  pluck(freq, when, dur, vol, dest, bright) {
    const o1 = actx.createOscillator(), o2 = actx.createOscillator();
    const f = actx.createBiquadFilter(), g = actx.createGain();
    o1.type = 'sawtooth'; o2.type = 'triangle';
    o1.frequency.value = freq; o2.frequency.value = freq * 2.002;
    f.type = 'lowpass';
    f.frequency.setValueAtTime(freq * (bright || 7) + 400, when);
    f.frequency.exponentialRampToValueAtTime(Math.max(200, freq * 1.6), when + Math.min(dur, 0.5));
    f.Q.value = 2;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(vol, when + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    const g2 = actx.createGain(); g2.gain.value = 0.3;
    o1.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(dest);
    o1.start(when); o2.start(when); o1.stop(when + dur + 0.05); o2.stop(when + dur + 0.05);
  },
  // bowed: slow attack, vibrato
  bow(freq, when, dur, vol, dest) {
    const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
    const lfo = actx.createOscillator(), lg = actx.createGain();
    o.type = 'sawtooth'; o.frequency.value = freq;
    lfo.frequency.value = 5.5; lg.gain.value = freq * 0.011;
    lfo.connect(lg); lg.connect(o.frequency);
    f.type = 'lowpass'; f.frequency.value = freq * 5 + 700; f.Q.value = 1.2;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(vol, when + Math.min(0.09, dur * 0.35));
    g.gain.setValueAtTime(vol, when + dur * 0.75);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(f); f.connect(g); g.connect(dest);
    o.start(when); lfo.start(when); o.stop(when + dur + 0.05); lfo.stop(when + dur + 0.05);
  },
  // reed / pipe: square with a breathy noise layer
  reed(freq, when, dur, vol, dest) {
    const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
    o.type = 'square'; o.frequency.value = freq;
    f.type = 'lowpass'; f.frequency.value = freq * 4 + 600;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(vol, when + 0.03);
    g.gain.setValueAtTime(vol, when + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(f); f.connect(g); g.connect(dest);
    o.start(when); o.stop(when + dur + 0.05);
    const n = actx.createBufferSource(); n.buffer = getNoise();
    const nf = actx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = freq * 2; nf.Q.value = 4;
    const ng = actx.createGain();
    ng.gain.setValueAtTime(vol * 0.18, when); ng.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    n.connect(nf); nf.connect(ng); ng.connect(dest);
    n.start(when); n.stop(when + dur);
  },
  bell(freq, when, dur, vol, dest) {
    [1, 2.01, 3.02, 4.7].forEach((mult, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = freq * mult;
      const v = vol / (i + 1.4);
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(v, when + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dur * (1 - i * 0.16));
      o.connect(g); g.connect(dest);
      o.start(when); o.stop(when + dur + 0.05);
    });
  },
  bass(freq, when, dur, vol, dest) {
    const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
    o.type = 'triangle'; o.frequency.value = freq;
    f.type = 'lowpass'; f.frequency.setValueAtTime(freq * 6, when);
    f.frequency.exponentialRampToValueAtTime(freq * 2, when + dur * 0.6);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(vol, when + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(f); f.connect(g); g.connect(dest);
    o.start(when); o.stop(when + dur + 0.05);
  },
  drum(kind, when, vol, dest) {
    const n = actx.createBufferSource(); n.buffer = getNoise();
    const f = actx.createBiquadFilter(), g = actx.createGain();
    let d = 0.06, v = vol;
    if (kind === 'K') {
      const o = actx.createOscillator(), og = actx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(150, when);
      o.frequency.exponentialRampToValueAtTime(45, when + 0.11);
      og.gain.setValueAtTime(vol * 2.2, when);
      og.gain.exponentialRampToValueAtTime(0.0001, when + 0.14);
      o.connect(og); og.connect(dest); o.start(when); o.stop(when + 0.16);
      f.type = 'lowpass'; f.frequency.value = 220; d = 0.05; v = vol * 0.5;
    } else if (kind === 'S') { f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = 0.7; d = 0.11; }
    else { f.type = 'highpass'; f.frequency.value = 7000; d = 0.03; v = vol * 0.55; }
    g.gain.setValueAtTime(v, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + d);
    n.connect(f); f.connect(g); g.connect(dest);
    n.start(when); n.stop(when + d + 0.01);
  }
};

const sfx = {
  _v(name, freq, dur, vol) { if (!actx) return; VOICES[name](freq, actx.currentTime, dur, vol, sfxGain); },
  tone(freq, dur, type, vol, slide) {
    if (!actx) return;
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, f0, f1) {
    if (!actx) return;
    const t = actx.currentTime, s = actx.createBufferSource(); s.buffer = getNoise();
    const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.1;
    f.frequency.setValueAtTime(f0 || 1200, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(vol || 0.1, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(sfxGain); s.start(t); s.stop(t + dur);
  },
  cursor() { this.tone(1050, 0.04, 'square', 0.05); },

// ---- music sequencer ----
const music = (() => {
  let cur = null, cursors = [], spb = 0.25, playing = false, name = '';
  function noteOn(tr, note, when, dur) {
    if (!actx) return;
    if (tr.drum) { VOICES.drum(note, when, tr.vol, musicGain); return; }
    const f = freqOf(note);
    if (!f) return;
    VOICES[tr.voice || 'pluck'](f, when, Math.min(dur * 0.95, tr.maxLen || 2.0), tr.vol, musicGain, tr.bright);
  }
  return {
    play(n, tune) {
      if (name === n && playing) return;
      audioUnlock();
      name = n; cur = tune; playing = true; spb = 60 / tune.tempo;
      const start = actx ? actx.currentTime + 0.08 : 0;
      cursors = tune.tracks.map(() => ({ i: 0, t: start }));
    },
    stop() { playing = false; cur = null; name = ''; },
    now() { return name; },
    pump() {
      if (!playing || !cur || !actx) return;
      const ahead = actx.currentTime + 0.4;
      for (let k = 0; k < cur.tracks.length; k++) {
        const tr = cur.tracks[k], c = cursors[k];
        let guard = 0;
        while (c.t < ahead && guard++ < 300) {
          if (c.i >= tr.seq.length) { if (cur.loop === false) break; c.i = 0; }
          const ev = tr.seq[c.i], beats = ev[1] || 0.5, dur = beats * spb;
          if (ev[0]) noteOn(tr, ev[0], c.t, dur);
          c.t += dur; c.i++;
        }
      }
    }
  };
})();
function seq(s) {
  return s.trim().split(/\s+/).map(tok => {
    const p = tok.split(':');
    return [p[0] === '0' ? 0 : p[0], p.length > 1 ? parseFloat(p[1]) : 0.5];
  });
}

// ============================================================================
// SPRITES
// A player sprite is a 16x24 grid of palette indices. Index 0 is transparent.
// The same format is used by the editor, the presets, and the field renderer,
// so anything you can draw, the game can animate.
// ============================================================================
const SPR_W = 16, SPR_H = 24;
const PALETTE = [
  null,      // 0 transparent
  '#0d0a14', '#2a2438', '#4a4458', '#7a7488', '#b0aac0', '#f0ecf8',   // 1-6  greys
  '#5a2a18', '#8a4a24', '#c07840',                                     // 7-9  browns
  '#f0c090', '#d09860', '#a06840',                                     // 10-12 skin
  '#782818', '#c03828', '#f06848',                                     // 13-15 reds
  '#e8a020', '#f0d040', '#f8f0a0',                                     // 16-18 yellows
  '#285018', '#3a8828', '#78d048',                                     // 19-21 greens
  '#103858', '#2068a8', '#50b0e8', '#a8e0f8',                          // 22-25 blues
  '#302060', '#6038a0', '#a878e0',                                     // 26-28 purples
  '#501838', '#a03878', '#e878b0'                                      // 29-31 magentas
];

function blankSprite() { return new Uint8Array(SPR_W * SPR_H); }
function cloneSprite(s) { return new Uint8Array(s); }
function sprGet(s, x, y) { return (x < 0 || y < 0 || x >= SPR_W || y >= SPR_H) ? 0 : s[y * SPR_W + x]; }
function sprSet(s, x, y, v) { if (x >= 0 && y >= 0 && x < SPR_W && y < SPR_H) s[y * SPR_W + x] = v; }

// Procedural sprite builder. Used for the eight presets and for the editor's
// starting templates, so "draw your own" and "pick one" share a look.
function buildSprite(o) {
  o = o || {};
  const s = blankSprite();
  const OUT = 1;
  const skin = o.skin || 10, skinD = o.skinD || 11;
  const hair = o.hair === undefined ? 7 : o.hair;
  const shirt = o.shirt || 23, shirtD = o.shirtD || 22;
  const pants = o.pants || 2, shoe = o.shoe || 1;
  const R = (x0, y0, x1, y1, v) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) sprSet(s, x, y, v); };

  // head
  R(5, 3, 10, 9, skin);
  R(5, 9, 10, 9, skinD);
  if (!o.outlineOnly) { sprSet(s, 6, 6, OUT); sprSet(s, 9, 6, OUT); }        // eyes
  if (o.mouth !== false) { R(7, 8, 8, 8, skinD); }
  // hair
  if (o.hairStyle !== 'bald') {
    R(4, 1, 11, 2, hair);
    R(4, 3, 4, o.hairLong ? 8 : 5, hair);
    R(11, 3, 11, o.hairLong ? 8 : 5, hair);
    if (o.hairStyle === 'fringe') R(5, 3, 10, 3, hair);
    if (o.hairStyle === 'tall') R(5, 0, 10, 0, hair);
  }
  if (o.hat) { R(3, 1, 12, 2, o.hat); R(5, -1 + 1, 10, 0, o.hat); R(3, 2, 12, 2, o.hatBand || o.hat); }
  // torso
  R(4, 10, 11, 16, shirt);
  R(4, 15, 11, 16, shirtD);
  if (o.belt) R(4, 16, 11, 16, o.belt);
  if (o.vest) { R(5, 10, 6, 15, o.vest); R(9, 10, 10, 15, o.vest); }
  // arms
  R(2, 11, 3, 15, shirt); R(12, 11, 13, 15, shirt);
  R(2, 16, 3, 17, skin);  R(12, 16, 13, 17, skin);
  // legs
  R(5, 17, 7, 21, pants); R(8, 17, 10, 21, pants);
  R(5, 22, 7, 23, shoe);  R(8, 22, 10, 23, shoe);
  // outline pass: any transparent pixel touching a filled one becomes outline
  const src = cloneSprite(s);
  for (let y = 0; y < SPR_H; y++) for (let x = 0; x < SPR_W; x++) {
    if (src[y * SPR_W + x]) continue;
    if (sprGet(src, x - 1, y) || sprGet(src, x + 1, y) || sprGet(src, x, y - 1) || sprGet(src, x, y + 1))
      sprSet(s, x, y, OUT);
  }
  if (o.outlineOnly) {
    for (let i = 0; i < s.length; i++) if (s[i] !== OUT) s[i] = 0;
  }
  return s;
}

// Derive a back view so the character doesn't stare at you while walking away:
// the face area gets filled with whatever colour the hair is.
function makeBackView(s) {
  const b = cloneSprite(s);
  const tally = {};
  for (let y = 1; y <= 3; y++) for (let x = 3; x < 13; x++) {
    const v = sprGet(s, x, y);
    if (v && v !== 1) tally[v] = (tally[v] || 0) + 1;
  }
  let hair = 0, best = 0;
  for (const k in tally) if (tally[k] > best) { best = tally[k]; hair = +k; }
  if (!hair) return b;
  for (let y = 3; y <= 9; y++) for (let x = 0; x < SPR_W; x++) {
    const v = sprGet(s, x, y);
    if (v && v !== 1) sprSet(b, x, y, hair);
  }
  return b;
}

// Draw a sprite grid. dir picks front/back/mirrored, frame animates the legs.
function drawSprite(g, spr, back, x, y, dir, frame, opts) {
  opts = opts || {};
  const src = (dir === 'up' && back) ? back : spr;
  const flip = dir === 'left';
  const walking = opts.walking;
  const bob = walking && (frame % 4 === 1 || frame % 4 === 3) ? 1 : 0;
  const legShift = walking ? (frame % 4 === 1 ? 1 : frame % 4 === 3 ? -1 : 0) : 0;
  const sc = opts.scale || 1;
  if (opts.shadow !== false) { g.globalAlpha = 0.28; pellipse(g, x + 8 * sc, y + 23 * sc, 5 * sc, 2 * sc, '#000'); g.globalAlpha = 1; }
  if (opts.alpha !== undefined) g.globalAlpha = opts.alpha;
  for (let yy = 0; yy < SPR_H; yy++) {
    for (let xx = 0; xx < SPR_W; xx++) {
      const sx = flip ? SPR_W - 1 - xx : xx;
      const v = src[yy * SPR_W + sx];
      if (!v) continue;
      const c = opts.tint || PALETTE[v];
      if (!c) continue;
      let dx = xx, dy = yy;
      if (yy < 17) dy += bob;
      else if (yy >= 17) dx += (xx < 8 ? legShift : -legShift);
      g.fillStyle = c;
      g.fillRect(Math.round(x + dx * sc), Math.round(y + dy * sc), sc, sc);
    }
  }
  g.globalAlpha = 1;
}

// ============================================================================
// PLAYER + PROGRESSION
// ============================================================================
const MAX_LEVEL = 100;
function isSongLevel(lv) { return lv === 1 || lv % 5 === 0; }
function xpToNext(lv) { return Math.floor(10 * Math.pow(lv, 1.7) + 15 * lv); }

function newPlayer(name, instId, spr) {
  const inst = INSTRUMENTS.find(i => i.id === instId) || INSTRUMENTS[0];
  const p = {
    name: name || 'Nameless', inst: inst.id, spr: spr, back: makeBackView(spr),
    lv: 1, xp: 0,
    base: { hp: 55, br: 16, atk: 9, def: 7, mus: 9, spd: 9 },
    grow: { hp: 0, br: 0, atk: 0, def: 0, mus: 0, spd: 0 },
    hp: 0, br: 0,
    songs: [],                       // [{elem, idx}]
    affinity: {},                    // elem -> times chosen
    upgrades: {},                    // elem -> ladder completions
    items: { tonic: 3, rosin: 2 },
    gold: 60,
    flags: {}
  };
  ELEMENTS.forEach(e => { p.affinity[e.id] = 0; p.upgrades[e.id] = 0; });
  p.hp = maxHP(p); p.br = maxBR(p);
  return p;
}
function instOf(p) { return INSTRUMENTS.find(i => i.id === p.inst) || INSTRUMENTS[0]; }
// Instrument mods are a flat offset plus a gentle per-level lean. The bulk of
// progression lives in grow.*, so the instrument colours the curve without the
// level term compounding into a runaway (an early version had an upright bass
// at four times a fiddle's HP by level 70).
function maxHP(p) { const m = instOf(p).mods; return Math.max(1, p.base.hp + p.grow.hp + m.hp * 4); }
function maxBR(p) { const m = instOf(p).mods; return Math.max(1, p.base.br + p.grow.br + m.br * 3); }
function statATK(p) { const m = instOf(p).mods; return p.base.atk + p.grow.atk + m.atk * 2 + Math.floor(p.lv * m.atk * 0.06); }
function statDEF(p) { const m = instOf(p).mods; return p.base.def + p.grow.def + m.def * 2 + Math.floor(p.lv * m.def * 0.06); }
function statMUS(p) { const m = instOf(p).mods; return p.base.mus + p.grow.mus + m.mus * 2 + Math.floor(p.lv * m.mus * 0.06); }
function statSPD(p) { const m = instOf(p).mods; return p.base.spd + p.grow.spd + m.spd * 2 + Math.floor(p.lv * m.spd * 0.05); }

// The song book. Learning is always "next rung of that element's ladder";
// once a ladder is finished, further picks upgrade every song of that element.
function knowsSong(p, elem, idx) { return p.songs.some(s => s.elem === elem && s.idx === idx); }
function songsOf(p, elem) { return p.songs.filter(s => s.elem === elem).length; }
function nextSongIndex(p, elem) {
  const n = songsOf(p, elem);
  return n < SONGS[elem].length ? n : -1;
}
function songData(p, s) {
  const base = SONGS[s.elem][s.idx];
  const up = p.upgrades[s.elem] || 0;
  return { ref: base, elem: s.elem, idx: s.idx,
           name: base.name, cost: base.cost, kind: base.kind, target: base.target,
           status: base.status, extra: base.extra, schance: base.schance,
           hits: base.hits, drain: base.drain, cure: base.cure,
           pow: (base.pow || 0) * (1 + up * 0.15),
           upgraded: up };
}
function playerSongs(p) { return p.songs.map(s => songData(p, s)); }

// Apply one level-up choice. kind is 'general' or an element id.
// Returns a list of human-readable result lines for the level-up screen.
function applyLevelChoice(p, kind, atLv) {
  const lines = [];
  const song = isSongLevel(atLv === undefined ? p.lv : atLv);
  // automatic growth every level so the numbers keep pace with the bestiary
  const inst = instOf(p).mods;
  const hpG = 8 + Math.round(inst.hp * 0.35) + randInt(3);
  const brG = 5 + Math.round(inst.br * 0.4);
  p.grow.hp += hpG; p.grow.br += brG;
  lines.push('HP +' + hpG + '   Breath +' + brG);

  if (kind === 'general') {
    p.grow.atk += 3; p.grow.def += 3; p.grow.mus += 3;
    lines.push('ATK +3   DEF +3   MUSIC +3');
  } else {
    p.affinity[kind] = (p.affinity[kind] || 0) + 1;
    if (song) {
      const idx = nextSongIndex(p, kind);
      if (idx >= 0) {
        p.songs.push({ elem: kind, idx: idx });
        p.grow.atk += 1; p.grow.def += 1;
        lines.push('ATK +1   DEF +1');
        lines.push('LEARNED: ' + SONGS[kind][idx].name);
      } else {
        p.upgrades[kind] = (p.upgrades[kind] || 0) + 1;
        p.grow.atk += 1; p.grow.def += 1;
        lines.push('ATK +1   DEF +1');
        lines.push('All ' + elemById(kind).name + ' songs grew stronger!');
      }
    } else {
      p.grow.atk += 2; p.grow.def += 2;
      lines.push('ATK +2   DEF +2');
      lines.push(elemById(kind).name + ' affinity rose.');
    }
  }
  p.hp = maxHP(p); p.br = maxBR(p);
  return lines;
}
function grantXP(p, amount) {
  if (p.lv >= MAX_LEVEL) return [];
  p.xp += amount;
  const gained = [];
  while (p.lv < MAX_LEVEL && p.xp >= xpToNext(p.lv)) {
    p.xp -= xpToNext(p.lv);
    p.lv++;
    gained.push(p.lv);
  }
  return gained;
}

  quiet(g, x, y, t) {
    // rim light first, so the mass reads as a silhouette instead of vanishing
    // into a background that is nearly the same value
    const pulse = 0.55 + Math.sin(t / 600) * 0.15;
    g.globalAlpha = 0.30 * pulse; pcircle(g, x + 30, y + 28, 38, '#6038a0'); g.globalAlpha = 1;

      for (let k = 0; k < 4; k++) px(g, mx - 3 + k * 2, my - open, 1, 2, '#a878e0');
    }
    const fr = Math.floor(t / 200);
    for (let i = 0; i < 50; i++) {
      const a = hash2(i, fr) * 6.28, rr = 30 + hash2(i + 3, fr) * 18;
      px(g, x + 30 + Math.cos(a) * rr, y + 28 + Math.sin(a) * rr, 1, 1, 'rgba(168,120,224,0.45)');
    }
  }
};

function makeEnemy(id, tier) {
  const b = BESTIARY[id];
  const t = tier || 1;
  // HP scales faster than tier because the player's damage grows faster than
  // their level does. Without this, songs one-shot everything from level 5 on.
  const hpMul = b.boss ? 1 : Math.pow(t, 1.6);
  const xpMul = b.boss ? 1 : Math.pow(t, 1.5);
  const hp = Math.round(b.hp * hpMul);
  const e = {
    id: id, name: b.name, art: b.art, elem: b.elem, boss: !!b.boss,
    w: b.w, h: b.h, skills: b.skills,
    maxhp: hp, hp: hp,
    atk: Math.round(b.atk * (b.boss ? 1 : t)), def: Math.round(b.def * (b.boss ? 1 : t)),
    spd: Math.round(b.spd * (b.boss ? 1 : 0.85 + t * 0.12)),
    xp: Math.round(b.xp * xpMul), gold: Math.round(b.gold * t),
    st: {}, x: 0, y: 0, shake: 0, flash: 0, dead: false, fade: 1
  };
  return e;
}

// ============================================================================
// MOUSE (the sprite editor really wants one)
// ============================================================================
const mouse = { x: -99, y: -99, down: false, clicked: false, rdown: false };
function mousePos(e) {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (canvas.width / r.width) / SCALE;
  mouse.y = (e.clientY - r.top) * (canvas.height / r.height) / SCALE;
}
canvas.addEventListener('mousemove', mousePos);
canvas.addEventListener('mousedown', e => {
  mousePos(e); audioUnlock();
  if (e.button === 2) mouse.rdown = true; else { mouse.down = true; mouse.clicked = true; }
});
canvas.addEventListener('mouseup', e => { if (e.button === 2) mouse.rdown = false; else mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('mouseleave', () => { mouse.down = false; mouse.rdown = false; mouse.x = -99; mouse.y = -99; });
function inRect(x, y, w, h) { return mouse.x >= x && mouse.y >= y && mouse.x < x + w && mouse.y < y + h; }

function floodFill(spr, x, y, to) {
  const from = sprGet(spr, x, y);
  if (from === to) return;
  const stack = [[x, y]];
  let guard = 0;
  while (stack.length && guard++ < 2000) {
    const [cx, cy] = stack.pop();
    if (cx < 0 || cy < 0 || cx >= SPR_W || cy >= SPR_H) continue;
    if (spr[cy * SPR_W + cx] !== from) continue;
    spr[cy * SPR_W + cx] = to;
    stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
  }
}

// ---- the pixel editor ----
const ED = { gx: 12, gy: 34, cell: 6, palX: 122, palY: 34, palCell: 11 };
function updateEditor(dt) {
  const paint = (v) => {
    pushUndo();
    sprSet(CRE.spr, CRE.cx, CRE.cy, v);
    if (CRE.mirror) sprSet(CRE.spr, SPR_W - 1 - CRE.cx, CRE.cy, v);
    sfx.draw();
  };
  if (repeated('left', dt))  { CRE.cx = (CRE.cx + SPR_W - 1) % SPR_W; }
  if (repeated('right', dt)) { CRE.cx = (CRE.cx + 1) % SPR_W; }
  if (repeated('up', dt))    { CRE.cy = (CRE.cy + SPR_H - 1) % SPR_H; }
  if (repeated('down', dt))  { CRE.cy = (CRE.cy + 1) % SPR_H; }
  // Z paints and X erases directly, not via the ok/back bindings, so holding
  // Enter to finish does not also scribble on the canvas.
  if (keys['KeyZ'] || keys['Space']) { if (sprGet(CRE.spr, CRE.cx, CRE.cy) !== CRE.color) paint(CRE.color); }
  if (pressedMap['KeyX']) { pressedMap['KeyX'] = false; paint(0); }
  if (pressedMap['KeyQ']) { pressedMap['KeyQ'] = false; CRE.color = (CRE.color + PALETTE.length - 1) % PALETTE.length; sfx.cursor(); }
  if (pressedMap['KeyE']) { pressedMap['KeyE'] = false; CRE.color = (CRE.color + 1) % PALETTE.length; sfx.cursor(); }
  if (pressedMap['KeyF']) { pressedMap['KeyF'] = false; pushUndo(); floodFill(CRE.spr, CRE.cx, CRE.cy, CRE.color); if (CRE.mirror) floodFill(CRE.spr, SPR_W - 1 - CRE.cx, CRE.cy, CRE.color); sfx.confirm(); }
  if (pressedMap['KeyM']) { pressedMap['KeyM'] = false; CRE.mirror = !CRE.mirror; sfx.cursor(); }
  if (pressedMap['KeyU']) { pressedMap['KeyU'] = false; if (CRE.undo.length) { CRE.spr = CRE.undo.pop(); sfx.cancel(); } }
  if (pressedMap['KeyR']) { pressedMap['KeyR'] = false; pushUndo(); CRE.spr = blankSprite(); sfx.cancel(); }
  if (pressedMap['KeyT']) { pressedMap['KeyT'] = false; pushUndo(); CRE.tmpl = (CRE.tmpl + 1) % TEMPLATES.length; CRE.spr = TEMPLATES[CRE.tmpl].build(); sfx.confirm(); }

  // mouse painting
  const gw = SPR_W * ED.cell, gh = SPR_H * ED.cell;
  if (inRect(ED.gx, ED.gy, gw, gh)) {
    const mx = Math.floor((mouse.x - ED.gx) / ED.cell), my = Math.floor((mouse.y - ED.gy) / ED.cell);
    CRE.cx = clamp(mx, 0, SPR_W - 1); CRE.cy = clamp(my, 0, SPR_H - 1);
    if (mouse.down && sprGet(CRE.spr, CRE.cx, CRE.cy) !== CRE.color) paint(CRE.color);
    if (mouse.rdown) paint(0);
  }
  for (let i = 0; i < PALETTE.length; i++) {
    const x = ED.palX + (i % 8) * ED.palCell, y = ED.palY + Math.floor(i / 8) * ED.palCell;
    if (inRect(x, y, ED.palCell, ED.palCell) && mouse.clicked) { CRE.color = i; sfx.cursor(); mouse.clicked = false; }
  }
  if (inRect(232, 190, 76, 18) && mouse.clicked) { mouse.clicked = false; finishEditor(); }
  if (pressedMap['Enter']) { pressedMap['Enter'] = false; finishEditor(); }
  if (pressedMap['Escape']) { pressedMap['Escape'] = false; CRE.step = 'spritechoice'; sfx.cancel(); }
}
function finishEditor() {
  let any = 0;
  for (let i = 0; i < CRE.spr.length; i++) if (CRE.spr[i]) any++;
  if (any < 12) { sfx.error(); return; }
  CRE.step = 'instrument'; sfx.confirm();
}
function drawEditor() {
  bgCreation();
  drawText('Draw yourself', 12, 8, '#f4f0e8', { outline: true });
  drawTextR('mirror: ' + (CRE.mirror ? 'on' : 'off'), 308, 8, CRE.mirror ? '#90e8b0' : '#8880a0');

  // canvas with checkerboard
  const gw = SPR_W * ED.cell, gh = SPR_H * ED.cell;
  px(ctx, ED.gx - 2, ED.gy - 2, gw + 4, gh + 4, '#0d0a14');
  for (let y = 0; y < SPR_H; y++) for (let x = 0; x < SPR_W; x++) {

    const bg = (x + y) % 2 ? '#2a2448' : '#332a54';
    px(ctx, ED.gx + x * ED.cell, ED.gy + y * ED.cell, ED.cell, ED.cell, v ? PALETTE[v] : bg);
  }
  // guide lines at the waist and the centre
  ctx.globalAlpha = 0.25;
  px(ctx, ED.gx + 8 * ED.cell, ED.gy, 1, gh, '#a8e0f8');
  px(ctx, ED.gx, ED.gy + 17 * ED.cell, gw, 1, '#a8e0f8');
  ctx.globalAlpha = 1;
  // cursor
  const cxp = ED.gx + CRE.cx * ED.cell, cyp = ED.gy + CRE.cy * ED.cell;

  px(ctx, cxp - 1, cyp, 1, ED.cell, '#ffe08a'); px(ctx, cxp + ED.cell, cyp, 1, ED.cell, '#ffe08a');
  if (CRE.mirror) {

    ctx.globalAlpha = 1;
  }

  // palette
  drawText('Colours', ED.palX, ED.palY - 10, '#b0a8c8');
  for (let i = 0; i < PALETTE.length; i++) {
    const x = ED.palX + (i % 8) * ED.palCell, y = ED.palY + Math.floor(i / 8) * ED.palCell;
    if (i === 0) {
      px(ctx, x, y, ED.palCell - 1, ED.palCell - 1, '#332a54');
      pline(ctx, x, y + ED.palCell - 2, x + ED.palCell - 2, y, '#c03828');
    } else px(ctx, x, y, ED.palCell - 1, ED.palCell - 1, PALETTE[i]);
    if (i === CRE.color) {
      px(ctx, x - 1, y - 1, ED.palCell + 1, 1, '#ffe08a'); px(ctx, x - 1, y + ED.palCell - 1, ED.palCell + 1, 1, '#ffe08a');
      px(ctx, x - 1, y - 1, 1, ED.palCell + 1, '#ffe08a'); px(ctx, x + ED.palCell - 1, y - 1, 1, ED.palCell + 1, '#ffe08a');
    }
  }
  // current colour chip
  px(ctx, ED.palX, ED.palY + 50, 16, 16, '#0d0a14');
  if (CRE.color) px(ctx, ED.palX + 1, ED.palY + 51, 14, 14, PALETTE[CRE.color]);
  else { px(ctx, ED.palX + 1, ED.palY + 51, 14, 14, '#332a54'); drawText('/', ED.palX + 5, ED.palY + 55, '#c03828'); }
  drawText(CRE.color ? 'colour ' + CRE.color : 'eraser', ED.palX + 21, ED.palY + 55, '#d0c8e0');

  // live preview
  drawWindow(228, 30, 84, 96, { alpha: 0.8 });
  drawTextC('preview', 270, 36, '#9890b8');
  const fr = Math.floor(G.t / 150);
  const dirs = ['down', 'left', 'up', 'right'];
  const d = dirs[Math.floor(G.t / 1100) % 4];
  const bk = makeBackView(CRE.spr);
  drawSprite(ctx, CRE.spr, bk, 254, 48, d, fr, { scale: 2, walking: true });
  drawTextC(d, 270, 112, '#8880a0');

  // controls
  drawWindow(8, 186, 214, 48, { alpha: 0.82 });
  drawText('move: arrows   paint: Z   erase: X', 16, 192, '#c8c0dc');
  drawText('colour: Q/E or click   fill: F', 16, 204, '#c8c0dc');
  drawText('mirror: M   undo: U   clear: R   template: T', 16, 216, '#c8c0dc');
  const doneHot = inRect(232, 190, 76, 18);
  drawWindow(232, 190, 76, 18, doneHot ? { top: '#5a4a98' } : {});
  drawTextC('ENTER  done', 270, 196, doneHot ? '#fff4c0' : '#ffe08a');
}

  else if (id === 'bass') { pellipse(g, cx, cy + 4, 8, 9, c1); px(g, cx - 1, cy - 12, 2, 11, c2); pellipse(g, cx, cy + 4, 3, 3, '#2a1a10'); }

function describeSong(s) {
  if (s.kind === 'heal') return 'Restores health' + (s.target === 'party' ? ' to everyone.' : '.');
  if (s.kind === 'revive') return 'Calls a fallen player back.';
  if (s.kind === 'buff') return 'Strengthens ' + (s.target === 'party' ? 'the party.' : 'one player.');
  if (s.kind === 'debuff') return 'Weakens the enemy.';

// ---- map construction helpers ----
function makeMap(id, w, h, fill) {
  const t = new Array(w * h).fill(fill || '.');
  return { id: id, w: w, h: h, t: t, warps: [], npcs: [], chests: [], region: 'meadow', music: 'field', indoor: false };
}
function mget(m, x, y) { return (x < 0 || y < 0 || x >= m.w || y >= m.h) ? '^' : m.t[y * m.w + x]; }
function mset(m, x, y, c) { if (x >= 0 && y >= 0 && x < m.w && y < m.h) m.t[y * m.w + x] = c; }
function rect(m, x0, y0, w, h, c) { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) mset(m, x, y, c); }
function hline(m, x0, x1, y, c) { for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++) mset(m, x, y, c); }
function vline(m, y0, y1, x, c) { for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++) mset(m, x, y, c); }
// carve a road, turning water into bridge as it goes
function road(m, x0, y0, x1, y1) {
  const put = (x, y) => { mset(m, x, y, mget(m, x, y) === '~' ? 'B' : '='); };
  let x = x0, y = y0;
  while (x !== x1) { put(x, y); x += x < x1 ? 1 : -1; }
  while (y !== y1) { put(x, y); y += y < y1 ? 1 : -1; }
  put(x1, y1);
}
function building(m, x, y, w, h, doorOff) {
  rect(m, x, y, w, 1, 'V');
  rect(m, x, y + 1, w, h - 2, 'R');
  rect(m, x, y + h - 1, w, 1, 'W');
  const dx = x + (doorOff === undefined ? (w >> 1) : doorOff);
  mset(m, dx, y + h - 1, 'd');
  return { x: dx, y: y + h - 1 };
}
function makeNoise(w, h, cells, rnd) {
  const gw = cells + 1, grid = [];
  for (let i = 0; i < gw * gw; i++) grid.push(rnd());
  const sm = t => t * t * (3 - 2 * t);
  return function (x, y) {
    const fx = x / w * cells, fy = y / h * cells;
    const x0 = Math.floor(fx), y0 = Math.floor(fy);
    const tx = sm(fx - x0), ty = sm(fy - y0);
    const g = (i, j) => grid[clamp(j, 0, cells) * gw + clamp(i, 0, cells)];
    return lerp(lerp(g(x0, y0), g(x0 + 1, y0), tx), lerp(g(x0, y0 + 1), g(x0 + 1, y0 + 1), tx), ty);
  };
}

const MAPS = {};

function buildWorld() {
  const w = 80, h = 64;
  const m = makeMap('world', w, h, '.');
  const rnd = mulberry32(20260815);
  const elev = makeNoise(w, h, 7, rnd), moist = makeNoise(w, h, 9, rnd), detail = makeNoise(w, h, 18, rnd);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const northness = 1 - y / h;                     // north end is high country
    const e = elev(x, y) * 0.62 + northness * 0.55 + detail(x, y) * 0.1;
    const mo = moist(x, y);
    let c = '.';
    if (e > 0.80) c = '^';
    else if (e > 0.70) c = 'r';
    else if (mo < 0.22 && e < 0.42) c = '~';
    else if (mo > 0.66) c = (detail(x, y) > 0.5 ? 'T' : 'P');
    else if (mo > 0.55) c = ',';
    else if (mo < 0.34) c = '"';
    else c = detail(x, y) > 0.86 ? 'f' : '.';
    mset(m, x, y, c);
  }
  // hard border of peaks so you cannot walk off the edge
  for (let x = 0; x < w; x++) { mset(m, x, 0, '^'); mset(m, x, 1, '^'); mset(m, x, h - 1, '^'); mset(m, x, h - 2, '^'); }
  for (let y = 0; y < h; y++) { mset(m, 0, y, '^'); mset(m, 1, y, '^'); mset(m, w - 1, y, '^'); mset(m, w - 2, y, '^'); }
  // a river across the middle, with the roads bridging it later
  let ry = 34;
  for (let x = 2; x < w - 2; x++) {
    ry += rnd() > 0.5 ? 1 : -1; ry = clamp(ry, 26, 40);
    mset(m, x, ry, '~'); mset(m, x, ry + 1, '~');
    if (rnd() > 0.7) mset(m, x, ry + 2, '~');
  }
  // landmarks
  const TOWN = { x: 20, y: 52 }, CAVE = { x: 48, y: 9 }, SHRINE = { x: 62, y: 44 };
  rect(m, TOWN.x - 4, TOWN.y - 3, 9, 7, '.');
  road(m, TOWN.x, TOWN.y, 34, 44);

function buildCaves() {
  // floor 1
  const c1 = makeMap('cave1', 40, 30, 'X');
  c1.music = 'cave'; c1.region = 'cave'; c1.indoor = true;
  const rnd = mulberry32(777);
  const carve = (x, y, r) => { for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (dx * dx + dy * dy <= r * r + 1) mset(c1, x + dx, y + dy, 'D'); };
  let cx = 8, cy = 24;
  carve(cx, cy, 3);
  const pts = [[8, 24], [8, 18], [14, 16], [14, 9], [22, 8], [28, 12], [30, 20], [22, 22], [16, 24], [33, 7]];
  for (let i = 1; i < pts.length; i++) {
    let [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    while (x0 !== x1) { carve(x0, y0, 2); x0 += x0 < x1 ? 1 : -1; }
    while (y0 !== y1) { carve(x0, y0, 2); y0 += y0 < y1 ? 1 : -1; }
    carve(x1, y1, rnd() > 0.5 ? 3 : 2);
  }
  mset(c1, 8, 25, 'C');

  const pts2 = [[6, 22], [6, 16], [12, 13], [20, 15], [24, 9], [17, 6]];

  carve2(17, 3, 2);
  mset(c2, 17, 2, '*');
  c2.warps.push({ x: 17, y: 2, to: 'cave3', tx: 5, ty: 20, needFlag: 'boss_gravebell',
                  blocked: 'The bell still hangs in the way.' });

  // floor 3: the long gallery, with the Discordant at the end of it

  const pts3 = [[5, 20], [5, 14], [11, 11], [19, 13], [25, 8], [16, 5]];
  for (let i = 1; i < pts3.length; i++) {

    while (x0 !== x1) { carve3(x0, y0, 2); x0 += x0 < x1 ? 1 : -1; }
    while (y0 !== y1) { carve3(x0, y0, 2); y0 += y0 < y1 ? 1 : -1; }
    carve3(x1, y1, 3);
  }
  carve3(16, 5, 5); carve3(16, 2, 2);
  mset(c3, 5, 21, '*');
  c3.warps.push({ x: 5, y: 21, to: 'cave2', tx: 17, ty: 3 });

function buildAllMaps() {
  buildWorld(); buildTown(); buildInteriors(); buildCaves();
  for (const k in MAPS) prerenderMap(MAPS[k]);
}

// Pre-render each map once to an offscreen canvas; the field loop just blits.
function prerenderMap(m) {
  const c = document.createElement('canvas');
  c.width = m.w * TS; c.height = m.h * TS;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++)
    drawTile(g, mget(m, x, y), x * TS, y * TS, x, y);
  m.canvas = c;
}
