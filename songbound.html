// ============================================================================
// FIELD
// ============================================================================
const MOVE_MS = 150;
function currentMap() { return MAPS[G.mapId]; }

function startGame() {
  buildAllMaps();
  G.mapId = 'town';
  const m = MAPS.town;
  G.px = m.start.x; G.py = m.start.y;
  G.ox = 0; G.oy = 0; G.dir = 'up'; G.walking = false; G.frame = 0;
  G.steps = 0; G.encCool = 8;
  setScene('field');
  G.msg = { lines: [
    'You wake with a tune half-remembered and no name for it.',
    'Somewhere north of here, something is taking the songs.',
    'Best go and be loud about it.'
  ], i: 0 };
  music.play('town', TUNES.town);
}

function canWalk(m, x, y) {
  if (x < 0 || y < 0 || x >= m.w || y >= m.h) return false;
  if (tileSolid(mget(m, x, y))) return false;
  for (const n of m.npcs) if (n.x === x && n.y === y) return false;
  for (const c of m.chests) if (c.x === x && c.y === y && !isOpened(c)) return false;
  return true;
}
function isOpened(c) { return G.player && G.player.flags['chest_' + c.id]; }

function warpAt(m, x, y) { return m.warps.find(wp => wp.x === x && wp.y === y); }
// Some ways on are shut until the thing blocking them has been dealt with.
function tryWarp(wp) {
  if (!wp) return false;
  if (wp.needFlag && !G.player.flags[wp.needFlag]) {
    G.msg = { lines: [wp.blocked || 'The way is shut.'], i: 0 };
    return true;
  }
  doWarp(wp);
  return true;
}

function doWarp(wp) {
  sfx.door();
  fadeTo(() => {
    G.mapId = wp.to;
    const m = MAPS[wp.to];
    G.px = wp.tx; G.py = wp.ty; G.ox = 0; G.oy = 0; G.walking = false;
    G.encCool = 6;
    const tune = m.music || 'field';
    music.play(tune, TUNES[tune]);
  });
}

function facingTile() {
  const d = G.dir;
  return { x: G.px + (d === 'left' ? -1 : d === 'right' ? 1 : 0),
           y: G.py + (d === 'up' ? -1 : d === 'down' ? 1 : 0) };
}

function interact() {
  const m = currentMap(), f = facingTile();
  for (const n of m.npcs) {
    if (n.x === f.x && n.y === f.y) {
      if (n.dir !== undefined && !n.sign) n.dir = opposite(G.dir);
      G.msg = { lines: n.lines.slice(), i: 0, npc: n };
      sfx.confirm();
      return true;
    }
  }
  for (const c of m.chests) {
    if (c.x === f.x && c.y === f.y && !isOpened(c)) {
      G.player.flags['chest_' + c.id] = 1;
      G.player.items[c.item] = (G.player.items[c.item] || 0) + 1;
      sfx.chest();
      G.msg = { lines: ['You found ' + itemName(c.item) + '.'], i: 0 };
      return true;
    }
  }
  // a well, a sign you are standing on, etc.
  const here = mget(m, f.x, f.y);
  if (here === 'w') { G.msg = { lines: ['The water is very still. It does not echo.'], i: 0 }; return true; }
  if (here === 'g') { G.msg = { lines: ['The name has worn off. Somebody still leaves flowers.'], i: 0 }; return true; }
  if (here === 'b') { G.msg = { lines: ['A bed. Not yours.'], i: 0 }; return true; }
  return false;
}
function opposite(d) { return d === 'up' ? 'down' : d === 'down' ? 'up' : d === 'left' ? 'right' : 'left'; }

function regionHere() {
  const m = currentMap();
  return m.regionAt ? m.regionAt(G.px, G.py) : m.region;
}

function checkEncounter() {
  const m = currentMap();
  const rid = regionHere();
  if (!rid || !REGIONS[rid]) return;
  if (G.encCool > 0) { G.encCool--; return; }
  const encw = tileEnc(mget(m, G.px, G.py));
  if (!encw) return;
  const R = REGIONS[rid];
  if (Math.random() < R.rate * encw * 0.55) startBattle(rid);
}

function checkBossTrigger() {
  const m = currentMap();
  if (!m.boss) return;
  if (G.player.flags['boss_' + m.boss.flag]) return;
  const d = Math.abs(m.boss.x - G.px) + Math.abs(m.boss.y - G.py);
  if (d <= 1) {
    G.msg = { lines: m.boss.intro.slice(), i: 0, onDone: () => startBossBattle(m.boss.id, m.boss.flag) };
  }
}

function updateField(dt) {
  const m = currentMap();
  if (G.msg) { updateMessage(dt); return; }

  if (pressed('menu')) { openMenu(); return; }

  if (!G.walking) {
    let nd = null;
    const DIRS = ['up', 'down', 'left', 'right'];
    for (const d of DIRS) if (held(d)) { nd = d; break; }
    // A quick tap can have its keydown and keyup both land between two frames,
    // leaving held() false forever after. Fall back to the press edge so a
    // single tap still moves you one tile.
    if (!nd) for (const d of DIRS) if (pressed(d)) { nd = d; break; }
    if (nd) {
      G.dir = nd;
      const f = facingTile();
      const wp = warpAt(m, f.x, f.y);
      if (canWalk(m, f.x, f.y) || wp) {
        G.walking = true; G.moveT = 0;
        G.tx = f.x; G.ty = f.y;
      } else {
        G.frame = 0;
      }
    }
    if (pressed('ok')) { if (!interact()) tryWarp(warpAt(m, G.px, G.py)); }
  }

  if (G.walking) {
    G.moveT += dt;
    const f = clamp(G.moveT / MOVE_MS, 0, 1);
    G.ox = (G.tx - G.px) * f * TS;
    G.oy = (G.ty - G.py) * f * TS;
    G.frame = Math.floor(G.moveT / (MOVE_MS / 4)) % 4;
    if (f >= 1) {
      G.px = G.tx; G.py = G.ty; G.ox = 0; G.oy = 0; G.walking = false;
      G.steps++;
      if (G.steps % 2 === 0) sfx.step();
      const wp = warpAt(m, G.px, G.py);
      if (wp) { tryWarp(wp); return; }
      checkBossTrigger();
      if (!G.msg) checkEncounter();
    }
  } else {
    G.frame = 0;
  }

  // idle npc wander
  for (const n of m.npcs) {
    if (!n.wander) continue;
    n.wt = (n.wt || 0) + dt;
    if (n.wt > 2200) { n.wt = 0; n.dir = pick(['up', 'down', 'left', 'right']); }
  }
}

function camera() {
  const m = currentMap();
  const pxp = G.px * TS + G.ox, pyp = G.py * TS + G.oy;
  let cx = pxp + TS / 2 - W / 2, cy = pyp + TS / 2 - H / 2;
  if (m.w * TS <= W) cx = (m.w * TS - W) / 2; else cx = clamp(cx, 0, m.w * TS - W);
  if (m.h * TS <= H) cy = (m.h * TS - H) / 2; else cy = clamp(cy, 0, m.h * TS - H);
  return { x: Math.round(cx), y: Math.round(cy) };
}

function drawField() {
  const m = currentMap();
  const cam = camera();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(m.canvas, cam.x, cam.y, W, H, 0, 0, W, H);

  // sparkle pass on water so it isn't dead flat
  const tx0 = Math.floor(cam.x / TS), ty0 = Math.floor(cam.y / TS);
  for (let y = ty0; y <= ty0 + VIEW_H + 1; y++) for (let x = tx0; x <= tx0 + VIEW_W + 1; x++) {
    if (mget(m, x, y) !== '~') continue;
    const sx = x * TS - cam.x, sy = y * TS - cam.y;
    const ph = (G.t / 340 + hash2(x, y) * 6.28);
    if (Math.sin(ph) > 0.7) px(ctx, sx + 3 + ((hash2(x, y) * 9) | 0), sy + 4 + ((hash2(y, x) * 8) | 0), 2, 1, '#a8d8f0');
  }

  // chests
  for (const c of m.chests) {
    const sx = c.x * TS - cam.x, sy = c.y * TS - cam.y;
    if (sx < -TS || sy < -TS || sx > W || sy > H) continue;
    drawChest(ctx, sx, sy, isOpened(c));
  }

  // build a draw list so sprites overlap by depth
  const list = [];
  for (const n of m.npcs) {
    if (n.sign) continue;
    list.push({ y: n.y, draw: () => {
      const sp = npcSprite(n.look);
      drawSprite(ctx, sp.spr, sp.back, n.x * TS - cam.x, n.y * TS - cam.y - 8, n.dir || 'down', 0, {});
    } });
  }
  if (m.boss && !G.player.flags['boss_' + m.boss.flag]) {
    const b = m.boss;
    list.push({ y: b.y, draw: () => {
      const bd = BESTIARY[b.id];
      EART[bd.art](ctx, b.x * TS - cam.x - 14, b.y * TS - cam.y - 22, G.t);
    } });
  }
  list.push({ y: G.py, draw: () => {
    drawSprite(ctx, G.player.spr, G.player.back, G.px * TS + G.ox - cam.x, G.py * TS + G.oy - cam.y - 8,
               G.dir, G.frame, { walking: G.walking });
  } });
  list.sort((a, b) => a.y - b.y);
  list.forEach(o => o.draw());

  // indoor vignette
  if (m.indoor) {
    ctx.globalAlpha = 0.35;
    for (let i = 0; i < 26; i++) {
      const a = i / 26;
      px(ctx, 0, i, W, 1, 'rgba(0,0,0,' + (1 - a) * 0.5 + ')');
      px(ctx, 0, H - 1 - i, W, 1, 'rgba(0,0,0,' + (1 - a) * 0.5 + ')');
    }
    ctx.globalAlpha = 1;
  }
  drawFieldHUD();
  if (G.msg) drawMessage();
}

function drawChest(g, x, y, open) {
  if (open) {
    px(g, x + 3, y + 9, 10, 5, '#5a3a1e'); px(g, x + 3, y + 9, 10, 1, '#8a6440');
    px(g, x + 2, y + 4, 12, 4, '#7a5228'); px(g, x + 2, y + 4, 12, 1, '#a87a48');
  } else {
    px(g, x + 2, y + 6, 12, 8, '#7a5228'); px(g, x + 2, y + 6, 12, 3, '#a87a48');
    px(g, x + 2, y + 9, 12, 1, '#5a3a1e');
    px(g, x + 7, y + 9, 2, 3, '#f0d040');
    px(g, x + 2, y + 13, 12, 1, '#4a2e16');
  }
}

function drawFieldHUD() {
  const p = G.player;
  drawWindow(4, 4, 96, 30, { alpha: 0.8 });
  drawText(p.name, 10, 8, '#f4f0e8');
  drawTextR('Lv' + p.lv, 96, 8, '#ffe08a');
  drawBar(10, 18, 50, 4, p.hp / maxHP(p), '#70e890', '#1c8840');
  drawText(p.hp + '/' + maxHP(p), 64, 16, '#c8c0dc');
  drawBar(10, 25, 50, 3, p.br / maxBR(p), '#78b8f0', '#2a5a9c');
}

// ---- message box ----
function updateMessage(dt) {
  const m = G.msg;
  m.tick = (m.tick || 0) + dt;
  const full = m.lines[m.i] || '';
  const shown = Math.floor(m.tick / 14);
  if (pressed('ok') || mouse.clicked) {
    mouse.clicked = false;
    if (shown < full.length) { m.tick = full.length * 14 + 10; }
    else {
      m.i++;
      m.tick = 0;
      if (m.i >= m.lines.length) {
        const cb = m.onDone;
        G.msg = null;
        if (cb) cb();
        else if (m.npc && m.npc.shop) openShop(m.npc.shop);
        else if (m.npc && m.npc.inn) openInn(m.npc.inn);
      }
    }
  }
}
function drawMessage() {
  const m = G.msg;
  const bx = 8, by = H - 66, bw = W - 16, bh = 58;
  drawWindow(bx, by, bw, bh);
  const full = m.lines[m.i] || '';
  const shown = full.slice(0, Math.floor((m.tick || 0) / 14));
  const lines = wrap(shown, bw - 24);
  lines.forEach((l, i) => drawText(l, bx + 12, by + 12 + i * 12, '#f4f0e8'));
  if (Math.floor((m.tick || 0) / 14) >= full.length) {
    const bob = Math.sin(G.t / 180) > 0 ? 0 : 1;
    px(ctx, bx + bw - 16, by + bh - 12 + bob, 5, 3, '#ffe08a');
    px(ctx, bx + bw - 15, by + bh - 9 + bob, 3, 2, '#ffe08a');
    px(ctx, bx + bw - 14, by + bh - 7 + bob, 1, 1, '#ffe08a');
  }
}

const VIEW_W = W / TS, VIEW_H = H / TS;

// ============================================================================
// BATTLE
// One player against up to three enemies. Turn order by speed.
// ============================================================================
const BT = {
  enemies: [], region: 'meadow', bg: 'meadow', boss: null, bossFlag: null,
  phase: 'intro', t: 0,
  cmd: 0, sel: 0, scroll: 0, target: 0, pending: null,
  order: [], turn: 0,
  msg: '', msgT: 0,
  pops: [], shake: 0, flash: 0, flashCol: '#fff',
  pst: {}, pshake: 0, pflash: 0,
  reward: null, fx: null
};

function startBattle(regionId) {
  const R = REGIONS[regionId] || REGIONS.meadow;
  const n = 1 + (chance(0.55) ? 1 : 0) + (chance(0.20) ? 1 : 0);
  BT.enemies = [];
  for (let i = 0; i < n; i++) {
    const id = pick(R.mobs);
    const e = makeEnemy(id, R.tier * (0.9 + Math.random() * 0.25));
    BT.enemies.push(e);
  }
  beginBattle(regionId, R.bg, null, null);
}
function startBossBattle(id, flag) {
  BT.enemies = [makeEnemy(id, 1)];
  const m = currentMap();
  beginBattle(m.region || 'deep', (REGIONS[m.region] || REGIONS.deep).bg, id, flag);
}
function beginBattle(regionId, bg, bossId, bossFlag) {
  BT.region = regionId; BT.bg = bg; BT.boss = bossId; BT.bossFlag = bossFlag;
  BT.phase = 'intro'; BT.t = 0; BT.cmd = 0; BT.sel = 0; BT.scroll = 0; BT.target = 0;
  BT.pops = []; BT.shake = 0; BT.flash = 0; BT.pshake = 0; BT.pflash = 0;
  BT.pst = {}; BT.msg = ''; BT.msgT = 0; BT.reward = null; BT.fx = null;
  layoutEnemies();
  sfx.encounter();
  music.play(bossId ? 'boss' : 'battle', bossId ? TUNES.boss : TUNES.battle);
  setScene('battle');
}
function layoutEnemies() {
  const n = BT.enemies.length;
  BT.enemies.forEach((e, i) => {
    if (n === 1) { e.x = 172; e.y = 58; }
    else if (n === 2) { e.x = 150 + i * 64; e.y = 52 + i * 22; }
    else { e.x = 132 + i * 52; e.y = 44 + (i % 2) * 30; }
    e.ax = 0; e.ay = 0;
  });
}
function aliveEnemies() { return BT.enemies.filter(e => !e.dead); }

function pop(x, y, text, col) { BT.pops.push({ x: x, y: y, text: text, col: col, t: 0, vy: -0.6 }); }

// ---- stat helpers with status modifiers ----
function stMod(st, key) {
  let m = 0;
  for (const k in st) {
    const s = STATUS[k];
    if (s && s.mod && s.mod[key] !== undefined) m += s.mod[key];
  }
  return m;
}
function pATK() { return Math.round(statATK(G.player) * (1 + stMod(BT.pst, 'atk'))); }
function pDEF() { return Math.round(statDEF(G.player) * (1 + stMod(BT.pst, 'def'))); }
function pMUS() { return Math.round(statMUS(G.player) * (1 + stMod(BT.pst, 'mus'))); }
function pSPD() { return Math.round(statSPD(G.player) * (1 + stMod(BT.pst, 'spd'))); }
function eATK(e) { return Math.round(e.atk * (1 + stMod(e.st, 'atk'))); }
function eDEF(e) { return Math.round(e.def * (1 + stMod(e.st, 'def'))); }
function eSPD(e) { return Math.round(e.spd * (1 + stMod(e.st, 'spd'))); }

// ---- damage model ----
// Defence gives diminishing returns rather than flat subtraction. With flat
// subtraction the same enemy is lethal at level 3 and harmless at level 15,
// because the player's DEF climbs by a fixed amount every single level.
// Tune the whole game's lethality with DEF_K and the three multipliers.
const DEF_K = 90;
function mitigate(power, def) {
  return Math.max(1, Math.round(power * (1 - def / (def + DEF_K)) * (0.9 + Math.random() * 0.2)));
}
function physDamage(atk, def) { return mitigate(atk * 1.7, def); }
function enemyDamage(atk, def) { return mitigate(atk * 1.55, def); }

// Songs are powered by MUSIC plus affinity in that element. This matters:
// only the General pick raises MUSIC, so without the affinity term a player who
// always picks an element -- exactly the specialist the level system invites --
// would have a permanently feeble stat behind every song they own.
// Affinity lets deep investment in one element substitute for broad MUSIC.
function songMusic(mus, aff) { return mus + (aff || 0) * 3; }
function songDamage(mus, pow, def, aff) { return mitigate(songMusic(mus, aff) * 2.6 * pow, def); }
function songHeal(mus, pow, aff) { return Math.round(songMusic(mus, aff) * pow * 2.2); }

function applyStatus(target, key, isPlayer) {
  const s = STATUS[key];
  if (!s) return;
  const bag = isPlayer ? BT.pst : target.st;
  bag[key] = s.turns;
  pop(isPlayer ? 60 : target.x + 18, isPlayer ? 150 : target.y, s.name + '!', s.col);
}

function damageEnemy(e, amount, col) {
  e.hp -= amount;
  e.flash = 200; e.shake = 260;
  pop(e.x + 18, e.y + 8, String(amount), col || '#ffffff');
  if (e.hp <= 0) { e.hp = 0; e.dead = true; e.fade = 1; }
}
function damagePlayer(amount) {
  G.player.hp = Math.max(0, G.player.hp - amount);
  BT.pflash = 220; BT.pshake = 300; BT.shake = 8;
  pop(58, 150, String(amount), '#ff8080');
}
function healPlayer(amount) {
  const before = G.player.hp;
  G.player.hp = Math.min(maxHP(G.player), G.player.hp + amount);
  pop(58, 150, '+' + (G.player.hp - before), '#90e8b0');
}

// ---- turn order ----
function beginRound() {
  const list = [{ who: 'p', spd: pSPD() + Math.random() * 3 }];
  aliveEnemies().forEach(e => list.push({ who: e, spd: eSPD(e) + Math.random() * 3 }));
  list.sort((a, b) => b.spd - a.spd);
  BT.order = list; BT.turn = 0;
  nextTurn();
}
function nextTurn() {
  if (G.player.hp <= 0) { endBattle(false); return; }
  if (!aliveEnemies().length) { endBattle(true); return; }
  while (BT.turn < BT.order.length) {
    const slot = BT.order[BT.turn];
    if (slot.who !== 'p' && slot.who.dead) { BT.turn++; continue; }
    break;
  }
  if (BT.turn >= BT.order.length) { endOfRound(); return; }
  const slot = BT.order[BT.turn];
  if (slot.who === 'p') {
    if (BT.pst.stun) { setMsg('You cannot find the beat.'); BT.pst.stun--; if (!BT.pst.stun) delete BT.pst.stun; advanceAfter(700); return; }
    BT.phase = 'command'; BT.cmd = 0;
  } else {
    const e = slot.who;
    if (e.st.stun) { setMsg(e.name + ' is stunned.'); e.st.stun--; if (!e.st.stun) delete e.st.stun; advanceAfter(700); return; }
    BT.phase = 'enemyturn'; BT.t = 0;
    enemyAct(e);
  }
}
function advanceAfter(ms) {
  BT.phase = 'wait'; BT.waitT = ms;
}
function setMsg(s) { BT.msg = s; BT.msgT = 0; }

function endOfRound() {
  // damage-over-time and buff expiry
  let lines = [];
  for (const k in BT.pst) {
    const s = STATUS[k];
    if (s.dot) { const d = Math.max(1, Math.round(maxHP(G.player) * s.dot)); damagePlayer(d); lines.push(s.name + ' bites.'); }
    if (s.regen) { healPlayer(Math.max(1, Math.round(maxHP(G.player) * s.regen))); }
    BT.pst[k]--; if (BT.pst[k] <= 0) delete BT.pst[k];
  }
  aliveEnemies().forEach(e => {
    for (const k in e.st) {
      const s = STATUS[k];
      if (s.dot) { const d = Math.max(1, Math.round(e.maxhp * s.dot)); damageEnemy(e, d, s.col); }
      e.st[k]--; if (e.st[k] <= 0) delete e.st[k];
    }
  });
  if (G.player.hp <= 0) { endBattle(false); return; }
  if (!aliveEnemies().length) { endBattle(true); return; }
  BT.phase = 'wait'; BT.waitT = 260; BT.afterWait = beginRound;
}

// ---- player actions ----
function doStrike(target) {
  const e = target;
  const crit = chance(0.08);
  let d = physDamage(pATK(), eDEF(e));
  if (crit) d = Math.round(d * 1.8);
  damageEnemy(e, d, crit ? '#ffe08a' : '#ffffff');
  setMsg(crit ? 'A clean hit!' : 'You strike ' + e.name + '.');
  crit ? sfx.crit() : sfx.hit();
  BT.fx = { kind: 'strike', t: 0, x: e.x + 18, y: e.y + 16 };
  advanceAfter(650);
}
function doSong(sd, targetIdx) {
  const p = G.player;
  if (p.br < sd.cost) { sfx.error(); setMsg('Not enough breath.'); BT.phase = 'command'; return; }
  p.br -= sd.cost;
  const el = elemById(sd.elem);
  const aff = p.affinity[sd.elem] || 0;
  playSongSound(sd, el);
  BT.fx = { kind: 'song', elem: sd.elem, t: 0, target: sd.target, idx: targetIdx };
  setMsg(p.name + ' plays ' + sd.name + '!');

  const hits = sd.hits || 1;
  if (sd.kind === 'dmg') {
    const targets = sd.target === 'all' ? aliveEnemies() : [aliveEnemies()[targetIdx] || aliveEnemies()[0]];
    let total = 0;
    targets.forEach(e => {
      for (let i = 0; i < hits; i++) {
        const d = songDamage(pMUS(), sd.pow, eDEF(e), aff);
        damageEnemy(e, d, el.col);
        total += d;
      }
      if (sd.status && chance(sd.schance === undefined ? 0.5 : sd.schance)) applyStatus(e, sd.status, false);
    });
    if (sd.drain) healPlayer(Math.round(total * sd.drain));
  } else if (sd.kind === 'heal') {
    healPlayer(songHeal(pMUS(), sd.pow, aff));
    if (sd.cure) BT.pst = keepGood(BT.pst);
    if (sd.status) applyStatus(null, sd.status, true);
    sfx.heal();
  } else if (sd.kind === 'revive') {
    healPlayer(Math.round(maxHP(G.player) * (sd.pow || 0.5)));
    sfx.heal();
  } else if (sd.kind === 'buff') {
    if (sd.status) applyStatus(null, sd.status, true);
    if (sd.extra) applyStatus(null, sd.extra, true);
    if (sd.cure) BT.pst = keepGood(BT.pst);
    sfx.buff();
  } else if (sd.kind === 'debuff') {
    const targets = sd.target === 'all' ? aliveEnemies() : [aliveEnemies()[targetIdx] || aliveEnemies()[0]];
    targets.forEach(e => {
      applyStatus(e, sd.status, false);
      if (sd.extra) applyStatus(e, sd.extra, false);
    });
    sfx.debuff();
  }
  advanceAfter(880);
}
function keepGood(bag) {
  const out = {};
  for (const k in bag) if (STATUS[k] && STATUS[k].good) out[k] = bag[k];
  return out;
}
function playSongSound(sd, el) {
  if (!actx) return;
  const inst = instOf(G.player);
  const scale = { fire: [392, 466, 587, 698], water: [349, 440, 523, 659], plant: [330, 415, 494, 622],
                  ice: [523, 622, 784, 932], electric: [440, 554, 659, 880], earth: [196, 233, 294, 349],
                  wind: [587, 698, 880, 1047], dark: [262, 311, 392, 466] }[sd.elem] || [440, 554, 659];
  const n = 5;
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      if (!actx) return;
      const f = scale[i % scale.length] * (i >= scale.length ? 2 : 1);
      if (inst.voice === 'drum') VOICES.drum(i % 2 ? 'S' : 'K', actx.currentTime, 0.22, sfxGain);
      else VOICES[inst.voice](f, actx.currentTime, 0.4, 0.15, sfxGain, inst.bright);
    }, i * 75);
  }
}
function doItem(id) {
  const p = G.player;
  if (!p.items[id]) { sfx.error(); return; }
  const it = ITEMS[id];
  p.items[id]--;
  if (p.items[id] <= 0) delete p.items[id];
  if (it.kind === 'heal' || it.kind === 'healall') { healPlayer(it.pow); sfx.heal(); setMsg('You use the ' + it.name + '.'); }
  else if (it.kind === 'breath') { p.br = Math.min(maxBR(p), p.br + it.pow); pop(58, 140, '+' + it.pow, '#78b8f0'); sfx.heal(); setMsg('Breath returns.'); }
  else if (it.kind === 'cure') { BT.pst = keepGood(BT.pst); sfx.buff(); setMsg('You feel clearer.'); }
  else if (it.kind === 'revive') { healPlayer(Math.round(maxHP(p) * 0.5)); sfx.heal(); setMsg('New strings. New wind.'); }
  else if (it.kind === 'escape') {
    if (BT.boss) { setMsg('Not from this one.'); }
    else { sfx.flee(); setMsg('You slip away.'); BT.phase = 'wait'; BT.waitT = 700; BT.afterWait = () => endBattle('fled'); return; }
  }
  advanceAfter(650);
}
function doFlee() {
  if (BT.boss) { setMsg('There is no leaving this.'); advanceAfter(700); return; }
  const odds = 0.35 + pSPD() * 0.012;
  if (chance(odds)) {
    sfx.flee(); setMsg('You get clear.');
    BT.phase = 'wait'; BT.waitT = 650; BT.afterWait = () => endBattle('fled');
  } else { setMsg('You cannot break away!'); advanceAfter(700); }
}

// ---- enemy AI ----
function enemyAct(e) {
  const skills = e.skills || [{ name: 'Attack', pow: 1 }];
  let sk = pick(skills);
  if (sk.heal && e.hp > e.maxhp * 0.5) sk = skills[0];
  if (sk.heal) {
    const amt = Math.round(e.maxhp * sk.heal);
    e.hp = Math.min(e.maxhp, e.hp + amt);
    pop(e.x + 18, e.y + 8, '+' + amt, '#90e8b0');
    setMsg(e.name + ' mends itself.');
    sfx.heal();
    advanceAfter(700);
    return;
  }
  setMsg(e.name + ' uses ' + sk.name + '.');
  e.ax = -10;
  const hits = sk.hits || 1;
  let total = 0;
  for (let i = 0; i < hits; i++) {
    const d = enemyDamage(eATK(e) * (sk.pow || 1), pDEF());
    damagePlayer(d); total += d;
  }
  if (sk.drain) { const h = Math.round(total * sk.drain); e.hp = Math.min(e.maxhp, e.hp + h); pop(e.x + 18, e.y + 8, '+' + h, '#90e8b0'); }
  if (sk.status && chance(sk.chance === undefined ? 0.4 : sk.chance)) applyStatus(null, sk.status, true);
  sfx.hit();
  advanceAfter(760);
}

// ---- end of battle ----
function endBattle(win) {
  if (win === 'fled') {
    BT.phase = 'done';
    fadeTo(() => { setScene('field'); G.encCool = 10; const m = currentMap(); music.play(m.music || 'field', TUNES[m.music || 'field']); });
    return;
  }
  if (!win) {
    BT.phase = 'defeat'; BT.t = 0;
    music.stop(); sfx.down();
    return;
  }
  let xp = 0, gold = 0;
  BT.enemies.forEach(e => { xp += e.xp; gold += e.gold; });
  G.player.gold += gold;
  const levels = grantXP(G.player, xp);
  BT.reward = { xp: xp, gold: gold, levels: levels };
  if (BT.bossFlag) G.player.flags['boss_' + BT.bossFlag] = 1;
  if (BT.bossFlag === 'quiet') G.pendingEnding = true;
  BT.phase = 'victory'; BT.t = 0;
  music.play('victory', TUNES.victory);
}

// ---- battle update ----
function updateBattle(dt) {
  BT.t += dt;
  BT.msgT += dt;
  if (BT.shake > 0) BT.shake = Math.max(0, BT.shake - dt * 0.05);
  if (BT.pflash > 0) BT.pflash -= dt;
  if (BT.pshake > 0) BT.pshake -= dt;
  BT.enemies.forEach(e => {
    if (e.flash > 0) e.flash -= dt;
    if (e.shake > 0) e.shake -= dt;
    if (e.dead && e.fade > 0) e.fade = Math.max(0, e.fade - dt / 500);
    if (e.ax) e.ax += (0 - e.ax) * Math.min(1, dt / 120);
  });
  BT.pops.forEach(p => { p.t += dt; p.y += p.vy; p.vy += dt * 0.0025; });
  BT.pops = BT.pops.filter(p => p.t < 900);
  if (BT.fx) { BT.fx.t += dt; if (BT.fx.t > 700) BT.fx = null; }

  switch (BT.phase) {
    case 'intro':
      if (BT.t > 620) { BT.phase = 'wait'; BT.waitT = 1; BT.afterWait = beginRound; }
      break;
    case 'wait':
      BT.waitT -= dt;
      if (BT.waitT <= 0) {
        const cb = BT.afterWait; BT.afterWait = null;
        if (cb) cb();
        else { BT.turn++; nextTurn(); }
      }
      break;
    case 'command': updateCommand(dt); break;
    case 'songmenu': updateSongMenu(dt); break;
    case 'itemmenu': updateItemMenu(dt); break;
    case 'target': updateTarget(dt); break;
    case 'victory':
      if (BT.t > 400 && (pressed('ok') || mouse.clicked)) {
        mouse.clicked = false;
        const lv = BT.reward.levels;
        if (lv && lv.length) { G.levelQueue = lv.slice(); openLevelUp(); }
        else returnFromBattle();
      }
      break;
    case 'defeat':
      if (BT.t > 900 && (pressed('ok') || mouse.clicked)) { mouse.clicked = false; gameOver(); }
      break;
  }
  mouse.clicked = false;
}

function updateCommand(dt) {
  const opts = ['Strike', 'Sing', 'Item', 'Flee'];
  if (repeated('up', dt)) { BT.cmd = (BT.cmd + 3) % 4; sfx.cursor(); }
  if (repeated('down', dt)) { BT.cmd = (BT.cmd + 1) % 4; sfx.cursor(); }
  for (let i = 0; i < 4; i++) if (inRect(10, 168 + i * 16, 74, 15)) {
    if (BT.cmd !== i) { BT.cmd = i; sfx.cursor(); }
    if (mouse.clicked) { mouse.clicked = false; chooseCommand(); }
  }
  if (pressed('ok')) chooseCommand();
}
function chooseCommand() {
  sfx.confirm();
  if (BT.cmd === 0) { BT.pending = { kind: 'strike' }; enterTarget(); }
  else if (BT.cmd === 1) {
    if (!G.player.songs.length) { sfx.error(); setMsg('You know no songs yet.'); return; }
    BT.phase = 'songmenu'; BT.sel = 0; BT.scroll = 0;
  } else if (BT.cmd === 2) {
    if (!Object.keys(G.player.items).length) { sfx.error(); setMsg('Your pack is empty.'); return; }
    BT.phase = 'itemmenu'; BT.sel = 0;
  } else { doFlee(); }
}
function enterTarget() {
  const alive = aliveEnemies();
  if (alive.length === 1) { resolvePending(0); return; }
  BT.phase = 'target'; BT.target = 0;
}
function resolvePending(idx) {
  const p = BT.pending;
  BT.pending = null;
  if (!p) return;
  if (p.kind === 'strike') doStrike(aliveEnemies()[idx] || aliveEnemies()[0]);
  else if (p.kind === 'song') doSong(p.song, idx);
}
function updateTarget(dt) {
  const alive = aliveEnemies();
  if (repeated('left', dt) || repeated('up', dt)) { BT.target = (BT.target + alive.length - 1) % alive.length; sfx.cursor(); }
  if (repeated('right', dt) || repeated('down', dt)) { BT.target = (BT.target + 1) % alive.length; sfx.cursor(); }
  alive.forEach((e, i) => { if (inRect(e.x, e.y, 44, 44)) { if (BT.target !== i) { BT.target = i; sfx.cursor(); } if (mouse.clicked) { mouse.clicked = false; resolvePending(i); } } });
  if (pressed('ok')) resolvePending(BT.target);
  if (pressed('back')) { sfx.cancel(); BT.pending = null; BT.phase = 'command'; }
}
function updateSongMenu(dt) {
  const songs = playerSongs(G.player);
  const perPage = 6;
  if (repeated('up', dt)) { BT.sel = (BT.sel + songs.length - 1) % songs.length; sfx.cursor(); }
  if (repeated('down', dt)) { BT.sel = (BT.sel + 1) % songs.length; sfx.cursor(); }
  BT.scroll = clamp(BT.scroll, Math.max(0, BT.sel - perPage + 1), BT.sel);
  for (let i = 0; i < Math.min(perPage, songs.length); i++) {
    if (inRect(94, 152 + i * 13, 150, 12)) {
      const idx = BT.scroll + i;
      if (BT.sel !== idx) { BT.sel = idx; sfx.cursor(); }
      if (mouse.clicked) { mouse.clicked = false; pickSong(songs); }
    }
  }
  if (pressed('ok')) pickSong(songs);
  if (pressed('back')) { sfx.cancel(); BT.phase = 'command'; }
}
function pickSong(songs) {
  const sd = songs[BT.sel];
  if (G.player.br < sd.cost) { sfx.error(); setMsg('Not enough breath for that.'); return; }
  sfx.confirm();
  if (sd.kind === 'dmg' && sd.target === 'one' || sd.kind === 'debuff' && sd.target === 'one') {
    BT.pending = { kind: 'song', song: sd }; enterTarget();
  } else { doSong(sd, 0); }
}
function updateItemMenu(dt) {
  const ids = Object.keys(G.player.items);
  if (!ids.length) { BT.phase = 'command'; return; }
  if (repeated('up', dt)) { BT.sel = (BT.sel + ids.length - 1) % ids.length; sfx.cursor(); }
  if (repeated('down', dt)) { BT.sel = (BT.sel + 1) % ids.length; sfx.cursor(); }
  BT.sel = clamp(BT.sel, 0, ids.length - 1);
  for (let i = 0; i < ids.length && i < 6; i++) if (inRect(94, 152 + i * 13, 150, 12)) {
    if (BT.sel !== i) { BT.sel = i; sfx.cursor(); }
    if (mouse.clicked) { mouse.clicked = false; sfx.confirm(); doItem(ids[BT.sel]); }
  }
  if (pressed('ok')) { sfx.confirm(); doItem(ids[BT.sel]); }
  if (pressed('back')) { sfx.cancel(); BT.phase = 'command'; }
}

// ---- battle drawing ----
function drawBattleBG() {
  const b = BT.bg;
  const pal = {
    meadow: ['#7ab8e0', '#a8d8f0', '#4a8a5a', '#2e6a3e', '#1e4a2a'],
    wood:   ['#3a5a7a', '#5a7a9a', '#2e5a3a', '#1e4028', '#14301c'],
    crag:   ['#8a9ab8', '#b8c8dc', '#6a6a72', '#4a4a52', '#32323a'],
    cave:   ['#241c2e', '#342a40', '#3a2e44', '#2c2234', '#1e1626'],
    deep:   ['#1e1430', '#2c1e44', '#342448', '#241a36', '#181026']
  }[b] || ['#7ab8e0', '#a8d8f0', '#4a8a5a', '#2e6a3e', '#1e4a2a'];
  vgrad(ctx, 0, 0, W, 90, pal[1], pal[0], 12);
  const drift = G.t / 90;
  // far ridge
  for (let x = 0; x < W; x++) {
    const hgt = 26 + Math.sin((x + drift * 0.25) / 42) * 9 + Math.sin((x + drift * 0.25) / 17) * 4;
    px(ctx, x, 90 - hgt, 1, hgt, pal[4]);
  }
  // mid ridge
  for (let x = 0; x < W; x++) {
    const hgt = 16 + Math.sin((x + drift * 0.6) / 26) * 7 + Math.sin((x + drift * 0.6) / 11) * 3;
    px(ctx, x, 96 - hgt, 1, hgt + 6, pal[3]);
  }
  // ground
  vgrad(ctx, 0, 96, W, H - 96, pal[2], pal[4], 10);
  for (let i = 0; i < 90; i++) {
    const gx = (hash2(i, 7) * W) | 0;
    const gy = 100 + ((hash2(i, 9) * (H - 104)) | 0);
    px(ctx, gx, gy, 1 + ((hash2(i, 11) * 2) | 0), 1, i % 3 ? pal[3] : pal[4]);
  }
  if (b === 'cave' || b === 'deep') {
    ctx.globalAlpha = 0.4;
    for (let i = 0; i < 14; i++) {
      const sx = (hash2(i, 21) * W) | 0, sl = 10 + ((hash2(i, 23) * 26) | 0);
      for (let k = 0; k < sl; k++) px(ctx, sx - (k >> 3), k, 2 + (k >> 3), 1, '#2a2036');
    }
    ctx.globalAlpha = 1;
  }
}

function drawBattle() {
  const sh = BT.shake > 0 ? (Math.random() * 2 - 1) * BT.shake : 0;
  ctx.save();
  ctx.translate(Math.round(sh), 0);
  drawBattleBG();

  // enemies
  const intro = BT.phase === 'intro' ? 1 - clamp(BT.t / 620, 0, 1) : 0;
  BT.enemies.forEach((e, i) => {
    const ex = e.x + e.ax + (e.shake > 0 ? (Math.random() * 2 - 1) * 3 : 0) + intro * 120;
    const ey = e.y + e.ay;
    if (e.dead && e.fade <= 0) return;
    if (e.dead) ctx.globalAlpha = e.fade;
    drawShadowEllipse(ex + e.w / 2 - 2, ey + e.h - 2, e.w * 0.32, 3);
    if (e.flash > 0) {
      ctx.save();
      EART[e.art](ctx, ex, ey, G.t);
      ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = 'rgba(255,255,255,' + clamp(e.flash / 200, 0, 1) * 0.85 + ')';
      ctx.fillRect(ex - 10, ey - 10, e.w + 24, e.h + 24);
      ctx.restore();
    } else {
      EART[e.art](ctx, ex, ey, G.t);
    }
    ctx.globalAlpha = 1;
    // status pips
    let sxp = ex;
    for (const k in e.st) { px(ctx, sxp, ey - 6, 4, 4, STATUS[k].col); sxp += 5; }
  });

  // targeting cursor
  if (BT.phase === 'target') {
    const e = aliveEnemies()[BT.target];
    if (e) {
      const bob = Math.sin(G.t / 160) * 2;
      const cx0 = e.x + e.w / 2 - 4, cy0 = e.y - 14 + bob;
      px(ctx, cx0, cy0, 9, 3, '#ffe08a');
      px(ctx, cx0 + 1, cy0 + 3, 7, 2, '#ffe08a');
      px(ctx, cx0 + 3, cy0 + 5, 3, 2, '#ffe08a');
      drawTextC(e.name, e.x + e.w / 2, e.y - 26, '#ffe08a', { outline: true });
      drawBar(e.x + e.w / 2 - 20, e.y - 18, 40, 3, e.hp / e.maxhp, '#f06848', '#a01818');
    }
  }

  // the player, drawn big
  const pxo = BT.pshake > 0 ? (Math.random() * 2 - 1) * 2 : 0;
  const pyo = Math.sin(G.t / 420) * 1;
  const psx = 40 + pxo, psy = 126 + pyo;
  drawShadowEllipse(psx + 16, psy + 50, 14, 4);
  drawSprite(ctx, G.player.spr, G.player.back, psx, psy, 'right', Math.floor(G.t / 200), { scale: 2, shadow: false });
  if (BT.pflash > 0) {
    ctx.globalAlpha = clamp(BT.pflash / 220, 0, 1) * 0.6;
    drawSprite(ctx, G.player.spr, G.player.back, psx, psy, 'right', 0, { scale: 2, shadow: false, tint: '#ff6060' });
    ctx.globalAlpha = 1;
  }

  // song effect
  if (BT.fx && BT.fx.kind === 'song') drawSongFX(BT.fx);
  if (BT.fx && BT.fx.kind === 'strike') {
    const f = BT.fx, k = clamp(f.t / 220, 0, 1);
    if (k < 1) for (let i = 0; i < 3; i++) pline(ctx, f.x - 16 + i * 4, f.y - 14 + k * 22, f.x + 10 + i * 4, f.y + 12 + k * 22, 'rgba(255,255,255,' + (1 - k) + ')');
  }

  // floating numbers
  BT.pops.forEach(p => {
    const a = clamp(1 - (p.t - 500) / 400, 0, 1);
    ctx.globalAlpha = a;
    drawTextC(p.text, p.x, p.y, p.col, { outline: true });
    ctx.globalAlpha = 1;
  });

  ctx.restore();

  drawBattleUI();
}

function drawSongFX(f) {
  const el = elemById(f.elem);
  if (!el) return;
  const k = clamp(f.t / 700, 0, 1);
  const targets = f.target === 'all' ? aliveEnemies() : [aliveEnemies()[f.idx] || aliveEnemies()[0]];
  // notes streaming from the player toward the target
  for (let i = 0; i < 14; i++) {
    const d = (k * 1.5 - i * 0.06);
    if (d < 0 || d > 1) continue;
    targets.forEach(e => {
      if (!e) return;
      const x0 = 70, y0 = 150, x1 = e.x + e.w / 2, y1 = e.y + e.h / 2;
      const xx = lerp(x0, x1, d), yy = lerp(y0, y1, d) - Math.sin(d * Math.PI) * 34 + Math.sin(i + G.t / 90) * 3;
      px(ctx, xx, yy, 3, 3, i % 2 ? el.col : el.col2);
      px(ctx, xx + 2, yy - 4, 1, 5, el.col);
    });
  }
  if (k > 0.55) {
    targets.forEach(e => {
      if (!e) return;
      const r = (k - 0.55) / 0.45;
      ctx.globalAlpha = 1 - r;
      pring(ctx, e.x + e.w / 2, e.y + e.h / 2, 6 + r * 26, el.col, 2);
      ctx.globalAlpha = 1;
    });
  }
}

// LEVEL UP
// The choice screen: General, or one of the eight elements. On a song level
// (1, then every level ending in 5 or 0) an element teaches you a new song.
// ============================================================================
const LU = { lv: 1, sel: 0, phase: 'choose', lines: [], t: 0 };

function openLevelUp() {
  const lv = G.levelQueue.shift();
  LU.lv = lv; LU.sel = 0; LU.phase = 'choose'; LU.lines = []; LU.t = 0;
  sfx.levelup();
  setScene('levelup');
}
function luCards() {
  const cards = [{ id: 'general', name: 'General', col: '#e8e0f0' }];
  ELEMENTS.forEach(e => cards.push({ id: e.id, name: e.name, col: e.col, elem: e }));
  return cards;
}
function luChoose() {
  const cards = luCards();
  const c = cards[LU.sel];
  LU.lines = applyLevelChoice(G.player, c.id, LU.lv);
  LU.phase = 'result'; LU.t = 0;
  if (c.id !== 'general' && isSongLevel(LU.lv)) sfx.song(); else sfx.buff();
}
function updateLevelUp(dt) {
  LU.t += dt;
  const cards = luCards();
  if (LU.phase === 'choose') {
    if (repeated('left', dt)) { LU.sel = (LU.sel + cards.length - 1) % cards.length; sfx.cursor(); }
    if (repeated('right', dt)) { LU.sel = (LU.sel + 1) % cards.length; sfx.cursor(); }
    if (repeated('up', dt)) { LU.sel = (LU.sel + cards.length - 3) % cards.length; sfx.cursor(); }
    if (repeated('down', dt)) { LU.sel = (LU.sel + 3) % cards.length; sfx.cursor(); }
    for (let i = 0; i < cards.length; i++) {
      const x = 8 + (i % 3) * 102, y = 46 + Math.floor(i / 3) * 42;
      if (inRect(x, y, 96, 38)) {
        if (LU.sel !== i) { LU.sel = i; sfx.cursor(); }
        if (mouse.clicked) { mouse.clicked = false; luChoose(); }
      }
    }
    if (pressed('ok')) luChoose();
  } else {
    if (LU.t > 300 && (pressed('ok') || mouse.clicked)) {
      mouse.clicked = false;
      if (G.levelQueue.length) openLevelUp();
      else returnFromBattle();
    }
  }
  mouse.clicked = false;
}
function luPreview(c) {
  if (c.id === 'general') return ['ATK +3   DEF +3   MUSIC +3', 'Steady growth, no new song.'];
  const song = isSongLevel(LU.lv);
  if (!song) return ['ATK +2   DEF +2', elemById(c.id).name + ' affinity +1 (songs of this element hit harder).'];
  const idx = nextSongIndex(G.player, c.id);
  if (idx < 0) return ['ATK +1   DEF +1', 'Ladder complete: every ' + c.name + ' song grows stronger.'];
  const s = SONGS[c.id][idx];
  return ['Learn: ' + s.name + '   (' + s.cost + ' breath)', describeSong(s)];
}
function drawLevelUp() {
  bgCreation();
  const song = isSongLevel(LU.lv);
  drawWindow(8, 6, 304, 34);
  drawTextC('Level ' + LU.lv, 160, 12, '#ffe08a', { outline: true });
  drawTextC(song ? 'A song level. Choose an element to learn its next song.'
                 : 'Choose your growth.', 160, 26, song ? '#90e8b0' : '#b0a8c8');

  const cards = luCards();
  for (let i = 0; i < cards.length; i++) {
    const c = cards[i];
    const x = 8 + (i % 3) * 102, y = 46 + Math.floor(i / 3) * 42;
    const sel = i === LU.sel;
    const known = c.elem ? songsOf(G.player, c.id) : 0;
    drawWindow(x, y, 96, 38, sel ? { top: c.elem ? c.elem.col2 : '#4a3a80', bot: '#181030' } : { alpha: 0.72 });
    if (sel) { px(ctx, x, y, 96, 1, '#ffe08a'); px(ctx, x, y + 37, 96, 1, '#ffe08a'); }
    if (c.elem) {
      drawElemIcon(ctx, c.elem, x + 18, y + 19, G.t, sel);
      drawText(c.name, x + 34, y + 8, sel ? c.col : '#c0b8d8', { outline: sel });
      drawText(known + '/' + SONGS[c.id].length + ' songs', x + 34, y + 20, '#9890b8');
      const up = G.player.upgrades[c.id] || 0;
      if (up) drawText('+' + up, x + 84, y + 20, '#90e8b0');
      if (song && nextSongIndex(G.player, c.id) >= 0) px(ctx, x + 88, y + 6, 4, 4, '#90e8b0');
    } else {
      drawText('General', x + 10, y + 8, sel ? '#ffe08a' : '#c0b8d8', { outline: sel });
      drawText('ATK  DEF  MUSIC', x + 10, y + 22, '#9890b8');
    }
  }

  if (LU.phase === 'choose') {
    const info = luPreview(cards[LU.sel]);
    drawWindow(8, 178, 304, 42);
    drawText(info[0], 16, 184, '#f4f0e8');
    wrap(info[1], 288).forEach((l, i) => drawText(l, 16, 198 + i * 11, '#b0a8c8'));
    drawTextC('Z to choose', 160, 228, '#8880a0');
  } else {
    drawWindow(48, 150, 224, 76);
    drawTextC('Level ' + LU.lv, 160, 156, '#ffe08a', { outline: true });
    LU.lines.forEach((l, i) => drawTextC(l, 160, 172 + i * 12, l.indexOf('LEARNED') === 0 ? '#90e8b0' : '#e8e0f0'));
    if (LU.t > 300) drawTextC('Z', 160, 214, '#8880a0');
  }
}

const MENU = { sel: 0, page: 'root', sub: 0, scroll: 0, note: '' };
function openMenu() { MENU.sel = 0; MENU.page = 'root'; MENU.sub = 0; MENU.note = ''; sfx.confirm(); setScene('menu'); }
function closeMenu() {
  sfx.cancel();
  setScene('field');
}
const MENU_ITEMS = ['Status', 'Songs', 'Items', 'Save', 'Close'];
function updateMenu(dt) {
  if (MENU.page === 'root') {
    if (repeated('up', dt)) { MENU.sel = (MENU.sel + MENU_ITEMS.length - 1) % MENU_ITEMS.length; sfx.cursor(); }
    if (repeated('down', dt)) { MENU.sel = (MENU.sel + 1) % MENU_ITEMS.length; sfx.cursor(); }
    for (let i = 0; i < MENU_ITEMS.length; i++) if (inRect(10, 40 + i * 18, 76, 16)) {
      if (MENU.sel !== i) { MENU.sel = i; sfx.cursor(); }
      if (mouse.clicked) { mouse.clicked = false; menuPick(); }
    }
    if (pressed('ok')) menuPick();
    if (pressed('back') || pressed('menu')) closeMenu();
  } else {
    const p = G.player;
    if (MENU.page === 'songs') {
      const n = Math.max(1, p.songs.length);

let lastT = 0;
function frame(now) {
  const dt = Math.min(50, now - lastT || 16);
  lastT = now;
  G.t += dt;
  music.pump();

  // fade transition
  if (G.fadeDir === 1) {
    G.fade = Math.min(1, G.fade + G.fadeSpeed * dt / 16);
    if (G.fade >= 1) { const cb = G.fadeCb; G.fadeCb = null; G.fadeDir = -1; if (cb) cb(); }
  } else if (G.fadeDir === -1) {
    G.fade = Math.max(0, G.fade - (G.fadeSpeed || 0.05) * dt / 16);
    if (G.fade <= 0) G.fadeDir = 0;
  }

  const blocked = G.fadeDir !== 0;
  if (!blocked) {
    switch (G.scene) {
      case 'title': updateTitle(dt); break;
      case 'creation': updateCreation(dt); break;
      case 'field': updateField(dt); break;
      case 'battle': updateBattle(dt); break;
      case 'levelup': updateLevelUp(dt); break;
      case 'menu': updateMenu(dt); break;
      case 'shop': updateShop(dt); break;
      case 'ending': updateEnding(dt); break;
    }
  }

  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  switch (G.scene) {
    case 'title': drawTitle(); break;
    case 'creation': drawCreation(); break;
    case 'field': drawField(); break;
    case 'battle': drawBattle(); break;
    case 'levelup': drawLevelUp(); break;
    case 'menu': drawMenu(); break;
    case 'shop': drawShop(); break;
    case 'ending': drawEnding(); break;
  }

  if (G.fade > 0) { ctx.globalAlpha = G.fade; px(ctx, 0, 0, W, H, '#000'); ctx.globalAlpha = 1; }

  clearPressed();
  mouse.clicked = false;
  typedQueue.length = 0;

  dctx.imageSmoothingEnabled = false;
  dctx.drawImage(buffer, 0, 0, W, H, 0, 0, canvas.width, canvas.height);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

    const best = songs.reduce((a, b) => ((b.pow || 0) > (a.pow || 0) ? b : a), songs[0] || { pow: 0, name: '-' });
    const hit = best.pow ? songDamage(statMUS(p), best.pow, e.def, p.affinity[best.elem] || 0) : physDamage(statATK(p), e.def);
    const taken = enemyDamage(e.atk, statDEF(p));
    return { boss: e.name, lv: lv, mode: mode || 'mixed', songs: p.songs.length, best: best.name,
             php: maxHP(p), pbr: maxBR(p), ehp: e.maxhp, hit: hit, taken: taken,
             casts: Math.ceil(e.maxhp / Math.max(1, hit)), survives: Math.ceil(maxHP(p) / Math.max(1, taken)) };
  }
};
</script>
